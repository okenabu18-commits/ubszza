
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roblox | Account Portal</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090b10;color:white;
 font-family:Arial,sans-serif;min-height:100vh;
 display:flex;align-items:center;justify-content:center;
 background-image:radial-gradient(ellipse at 50% 0%,#26395c 0%,#090b10 65%);
}
.card{
 width:420px;max-width:92%;
 padding:38px 30px;background:#141923;
 border:1px solid #303b50;border-radius:22px;
 box-shadow:0 25px 90px #0009;text-align:center;
}
.logo{font-size:48px;font-weight:1000;letter-spacing:-5px}
.tag{color:#8292aa;font-size:12px;letter-spacing:3px;margin-top:8px}
h2{margin:35px 0 10px}
.desc{color:#929eb1;font-size:14px;line-height:1.7}
button{
 width:100%;height:54px;border:0;border-radius:9px;
 margin-top:15px;font-weight:bold;font-size:14px;
 cursor:pointer;transition:.2s;
}
button:hover{transform:translateY(-3px);filter:brightness(1.15)}
.join{background:white;color:#111}
.sign{background:#335dff;color:white}
.profile{
 display:none;margin-top:28px;padding:22px;
 background:#202938;border-radius:14px;
}
.profile img{width:90px;height:90px;border-radius:50%;object-fit:cover}
.profile h3{margin-bottom:5px}
.id{color:#98a7bc;font-size:12px}
.status{color:#57dc9a;font-size:12px;margin-top:12px}
.footer{color:#67758c;font-size:11px;margin-top:30px}
.error{color:#ff8585;font-size:13px;margin-top:15px}
</style>
</head>
<body>
<div class="card">
 <div class="logo">ROBLOX</div>
 <div class="tag">ACCOUNT PORTAL</div>

 <h2>Welcome back!</h2>
 <div class="desc">
  Connect your Roblox account and access your profile.
 </div>

 <button class="join" onclick="login()">JOIN WITH ROBLOX</button>
 <button class="sign" onclick="login()">SIGN IN WITH ROBLOX</button>

 <div class="error" id="error"></div>

 <div class="profile" id="profile">
  <img id="avatar" src="" alt="Avatar">
  <h3 id="username">Username</h3>
  <div class="id" id="userid"></div>
  <div class="status">● Roblox account connected</div>
  <button class="sign" onclick="logout()">LOG OUT</button>
 </div>

 <div class="footer">
  SECURE ROBLOX OAUTH · ACCOUNT PORTAL
 </div>
</div>

<script>
const OAUTH_LOGIN_URL = "/api/oauth/roblox/login";

function login(){
 // Opens your Vercel OAuth backend.
 window.location.href = OAUTH_LOGIN_URL;
}

async function loadProfile(){
 try{
  const r=await fetch("/api/oauth/roblox/me",{
   credentials:"same-origin"
  });
  if(!r.ok)return;
  const data=await r.json();
  if(!data.user)return;

  document.getElementById("profile").style.display="block";
  document.getElementById("username").textContent=
   data.user.username || data.user.displayName || "Roblox User";
  document.getElementById("userid").textContent=
   "User ID: "+data.user.id;
  if(data.user.avatar){
   document.getElementById("avatar").src=data.user.avatar;
  }
 }catch(e){
  console.error(e);
 }
}

async function logout(){
 await fetch("/api/oauth/roblox/logout",{
  method:"POST",
  credentials:"same-origin"
 });
 location.reload();
}

loadProfile();

const params=new URLSearchParams(location.search);
if(params.get("roblox_login")==="success"){
 history.replaceState({}, "", "/");
 loadProfile();
}
</script>
</body>
</html>
