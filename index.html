<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Player</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tv {
            width: 1000px;
            max-width: 95vw;
            background: #111;
            border-radius: 18px;
            padding: 10px;
            box-shadow: 0 0 40px rgba(0,0,0,.8);
        }

        .screen {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 12px;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .tv-title {
            padding: 12px 8px 4px;
            font-size: 20px;
            font-weight: bold;
        }

        .status {
            padding: 4px 8px 8px;
            color: #aaa;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            .tv {
                width: 100%;
                max-width: 100%;
                border-radius: 0;
                padding: 5px;
            }

            .screen {
                border-radius: 8px;
            }
        }
    </style>
</head>

<body>

    <div class="tv">

        <div class="screen">
            <iframe
                src="https://ok.ru/videoembed/9548582816350"
                allow="autoplay; fullscreen"
                allowfullscreen>
            </iframe>
        </div>

        <div class="tv-title">
            TV Player
        </div>

        <div class="status">
            Online • OK Video
        </div>

    </div>

</body>
</html>
