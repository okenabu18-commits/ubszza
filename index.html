<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>TV Player</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #050505;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

/* MAIN TV */

.tv-player {
    width: min(1000px, 100%);
    background: #101010;
    border-radius: 16px;
    overflow: hidden;
    box-shadow:
        0 25px 80px rgba(0,0,0,.75),
        0 0 0 1px rgba(255,255,255,.06);
}

/* VIDEO */

.video-box {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    overflow: hidden;
}

.video-box iframe {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    border: 0;
}

/* TOP OVERLAY */

.top {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;

    height: 70px;

    padding: 18px 20px;

    background: linear-gradient(
        to bottom,
        rgba(0,0,0,.75),
        transparent
    );

    pointer-events: none;
    z-index: 5;
}

.tv-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    font-size: 13px;
    font-weight: bold;
}

.live-dot {
    width: 9px;
    height: 9px;

    background: #ff1744;
    border-radius: 50%;

    box-shadow: 0 0 12px #ff1744;
}

/* FULLSCREEN BUTTON */

.fullscreen-button {
    position: absolute;

    right: 15px;
    bottom: 15px;

    width: 45px;
    height: 45px;

    border: 0;
    border-radius: 9px;

    background: rgba(0,0,0,.75);
    color: white;

    font-size: 23px;

    cursor: pointer;

    z-index: 20;

    display: flex;
    justify-content: center;
    align-items: center;

    backdrop-filter: blur(8px);

    transition: .2s;
}

.fullscreen-button:hover {
    background: rgba(255,255,255,.16);
}

.fullscreen-button:active {
    transform: scale(.92);
}

/* INFO */

.info {
    padding: 15px 18px 18px;
}

.title {
    font-size: 19px;
    font-weight: 700;
}

.description {
    margin-top: 6px;
    color: #888;
    font-size: 13px;
}

/* REAL FULLSCREEN */

.video-box:fullscreen {
    width: 100vw;
    height: 100vh;

    aspect-ratio: auto;

    background: #000;

    border-radius: 0;
}

.video-box:-webkit-full-screen {
    width: 100vw;
    height: 100vh;

    background: #000;

    border-radius: 0;
}

.video-box:fullscreen iframe,
.video-box:-webkit-full-screen iframe {
    width: 100vw;
    height: 100vh;
}

/* MOBILE */

@media (max-width: 600px) {

    body {
        padding: 0;
        align-items: center;
    }

    .tv-player {
        width: 100%;
        border-radius: 0;
        box-shadow: none;
    }

    .video-box {
        width: 100%;
        aspect-ratio: 16 / 9;
    }

    .fullscreen-button {
        width: 42px;
        height: 42px;

        right: 10px;
        bottom: 10px;

        font-size: 21px;
    }

    .info {
        padding: 13px;
    }

    .title {
        font-size: 16px;
    }

    .description {
        font-size: 12px;
    }
}

/* PHONE LANDSCAPE */

@media (max-width: 900px) and (orientation: landscape) {

    body {
        padding: 0;
    }

    .tv-player {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
    }

    .video-box {
        width: 100vw;
        height: 100vh;
        aspect-ratio: auto;
    }

    .video-box iframe {
        width: 100vw;
        height: 100vh;
    }

    .info {
        display: none;
    }
}
</style>
</head>

<body>

<div class="tv-player">

    <div class="video-box" id="videoBox">

        <!-- ORIGINAL OK.RU PLAYER -->

        <iframe
            src="https://ok.ru/videoembed/9548582816350"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen
            webkitallowfullscreen>
        </iframe>

        <!-- FULLSCREEN -->

        <button
            class="fullscreen-button"
            id="fullscreenButton"
            aria-label="Fullscreen">
            ⛶
        </button>

        <!-- TOP -->

        <div class="top">
            <div class="tv-label">
                <span class="live-dot"></span>
                TV
            </div>
        </div>

    </div>

    <div class="info">

        <div class="title">
            TV Player
        </div>

        <div class="description">
            OK.ru Video
        </div>

    </div>

</div>


<script>

const videoBox =
    document.getElementById("videoBox");

const fullscreenButton =
    document.getElementById("fullscreenButton");


/* FULLSCREEN */

async function enterFullscreen() {

    try {

        if (videoBox.requestFullscreen) {

            await videoBox.requestFullscreen({
                navigationUI: "hide"
            });

        } else if (videoBox.webkitRequestFullscreen) {

            videoBox.webkitRequestFullscreen();

        } else if (videoBox.msRequestFullscreen) {

            videoBox.msRequestFullscreen();

        }

    } catch (error) {

        console.log(
            "Fullscreen error:",
            error
        );

    }

}


/* EXIT */

async function exitFullscreen() {

    try {

        if (document.exitFullscreen) {

            await document.exitFullscreen();

        } else if (document.webkitExitFullscreen) {

            document.webkitExitFullscreen();

        }

    } catch (error) {

        console.log(error);

    }

}


/* BUTTON */

fullscreenButton.addEventListener(
    "click",
    async function() {

        const fullscreen =
            document.fullscreenElement ||
            document.webkitFullscreenElement;

        if (fullscreen) {

            await exitFullscreen();

        } else {

            await enterFullscreen();

        }

    }
);


/* ESC / FULLSCREEN CHANGE */

function updateButton() {

    const fullscreen =
        document.fullscreenElement ||
        document.webkitFullscreenElement;

    fullscreenButton.textContent =
        fullscreen ? "⛶" : "⛶";

}


/* STANDARD */

document.addEventListener(
    "fullscreenchange",
    updateButton
);


/* SAFARI */

document.addEventListener(
    "webkitfullscreenchange",
    updateButton
);

</script>

</body>
</html>
