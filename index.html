<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABU TV</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
}

#startScreen{
    position:fixed;
    inset:0;
    background:#050505;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

.startBox{
    text-align:center;
}

.logo{
    font-size:42px;
    font-weight:900;
    color:#00aaff;
    margin-bottom:25px;
}

.startBtn{
    border:0;
    background:#00aaff;
    color:white;
    font-size:22px;
    font-weight:bold;
    padding:18px 45px;
    border-radius:12px;
    cursor:pointer;
}

.startBtn:hover{
    background:#008dcc;
}

#app{
    display:none;
}

header{
    height:70px;
    background:#0d0d0d;
    border-bottom:1px solid #292929;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 25px;
}

.logo2{
    color:#00aaff;
    font-size:27px;
    font-weight:900;
}

header button{
    background:#191919;
    border:1px solid #333;
    color:white;
    border-radius:9px;
    padding:11px 15px;
    cursor:pointer;
    font-size:18px;
}

main{
    max-width:1600px;
    margin:auto;
    padding:25px;
}

.player{
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:15px;
    overflow:hidden;
}

iframe{
    width:100%;
    height:100%;
    border:0;
}

.title{
    font-size:30px;
    font-weight:bold;
    padding:20px 0 10px;
}

.info{
    color:#999;
}

@media(max-width:700px){

    header{
        height:58px;
        padding:0 12px;
    }

    .logo2{
        font-size:21px;
    }

    main{
        padding:10px;
    }

    .title{
        font-size:22px;
    }

    .logo{
        font-size:32px;
    }

    .startBtn{
        font-size:19px;
        padding:16px 35px;
    }
}

@media(min-width:1600px){

    header{
        height:85px;
        padding:0 45px;
    }

    .logo2{
        font-size:34px;
    }

    main{
        max-width:1800px;
        padding:35px;
    }

}
</style>
</head>

<body>

<!-- START -->

<div id="startScreen">

    <div class="startBox">

        <div class="logo">
            ABU TV
        </div>

        <button
            class="startBtn"
            id="startBtn">

            ▶ START

        </button>

    </div>

</div>


<!-- APP -->

<div id="app">

<header>

    <div class="logo2">
        ABU TV
    </div>

    <div>

        <button id="fullscreenBtn">
            ⛶
        </button>

    </div>

</header>


<main>

    <div
        class="player"
        id="player">

        <iframe
            id="video"
            src="about:blank"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen>
        </iframe>

    </div>


    <div class="title">
        Bergen HD
    </div>

    <div class="info">
        🎬 Film &nbsp; • &nbsp;
        HD &nbsp; • &nbsp;
        ⏱ 2:22:15
    </div>

</main>

</div>


<script>

const startScreen =
    document.getElementById("startScreen");

const app =
    document.getElementById("app");

const startBtn =
    document.getElementById("startBtn");

const video =
    document.getElementById("video");

const player =
    document.getElementById("player");


startBtn.addEventListener(
    "click",
    function(){

        /*
        OK.ru embed URL
        */

        video.src =
            "https://ok.ru/videoembed/9931741530647";

        startScreen.style.display =
            "none";

        app.style.display =
            "block";

    }
);


document
    .getElementById("fullscreenBtn")
    .addEventListener(
        "click",
        function(){

            if(
                document.fullscreenElement
            ){

                document.exitFullscreen();

            }else{

                player.requestFullscreen();

            }

        }
    );

</script>

</body>
</html>
