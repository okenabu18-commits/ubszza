<div class="two" style="grid-template-columns:200px 1fr;align-items:start"><div class="glass"><h3 style="font-size:13px">Toolbox</h3>${[['p','▭ Part'],['m','↔ Mover'],['c','🪙 Coin'],['s','🔺 Spike'],['f','🚩 Checkpoint'],['g','🌀 Goal'],['sp','🧍 Spawn'],['x','🧹 Erase']].map(([t,l])=>`<button class="btn tl ${S.tool==t?'c':'g'}" data-t="${t}" style="width:100%;margin:3px 0;text-align:left" onclick="ST.tool='${t}';document.querySelectorAll('.tl').forEach(b=>b.className='btn tl '+(b.dataset.t=='${t}'?'c':'g'))">${l}</button>`).join('')}<h3 style="font-size:13px;margin-top:10px">Properties</h3><input id="stc" type="color" value="${S.col}"><input id="stw" type="number" value="${S.w}" placeholder="Width"><input id="sth" type="number" value="${S.h}" placeholder="Height"><p class="m" id="cnt">${S.M.length} parts</p><button class="btn g" style="width:100%" onclick="ST.M.pop();edDraw()">↶ UNDO</button></div>
<div><canvas id="ed" width="900" height="450" style="width:100%;border-radius:14px;border:1px solid #ffffff22;touch-action:none"></canvas><input type="range" min="0" max="1800" step="20" value="${S.off}" oninput="ST.off=+this.value;edDraw()"></div></div>
<div class="two" style="margin-top:16px"><div class="glass"><h3>LocalScript</h3><p class="m">Commands: <b>title "text"</b> · <b>speed 2-9</b> · <b>jump 8-18</b> · <b>gravity 0.3-1</b> · <b>onCoin N "message"</b>. (Safe script language — no raw code.)</p><textarea id="st3" rows="6" style="width:100%;background:#0d0b1c;color:#9cf;border:1px solid #ffffff22;border-radius:10px;padding:10px;font:12px monospace">${esc(S.sc)}</textarea></div>
<div class="glass"><h3>Game info</h3><input id="st1" maxlength="40" placeholder="Game name" value="${esc(S.n)}"><textarea id="st2" rows="3" maxlength="200" placeholder="Bio / description" style="width:100%;background:#0d0b1c;color:#fff;border:1px solid #ffffff22;border-radius:10px;padding:10px;font:inherit">${esc(S.bio)}</textarea><p class="m">Thumbnail (auto-made from your map, or upload):</p><input type="file" accept="image/*" onchange="upThumb(this)"><div class="row" style="margin-top:8px"><button class="btn" onclick="testG()">▶ TEST</button><button class="btn c" onclick="saveG();go()">SAVE</button><button class="btn" onclick="const i=saveG();if(i>=0)pubDlg(i)">PUBLISH $1</button></div></div></div>
<div id="pubbox"></div><div id="stage"></div><h2>My games</h2><div class="grid">${u.sg.map((g,i)=>`<div class="glass card"><img src="${g.thumb}" style="width:100%;border-radius:10px"><h3 style="font-size:14px;margin:8px 0">${esc(g.n)}</h3><span class="badge" style="color:#9aa4c7;border-color:#9aa4c7">${g.st.toUpperCase()}</span><div class="row" style="justify-content:center;margin-top:10px"><button class="btn g" onclick="edG(${i})">EDIT</button><button class="btn" onclick="pubDlg(${i})">PUBLISH</button><button class="btn r" onclick="delG(${i})">✕</button></div></div>`).join('')||'<p class="m">No saved games yet.</p>'}</div>`},
players:()=>{const u=me(),req=u?(u.inc||[]).filter(k=>DB.users[k]):[];return `<h2>Find players</h2><div class="glass"><input placeholder="Search by username or nickname…" value="${esc(window.PQ||'')}" oninput="PQ=this.value;$('#pres').innerHTML=pres()"></div>${req.length?`<h2>Friend requests</h2><div class="glass">${req.map(k=>`<p class="row">${ava(DB.users[k],28)} ${esc(DB.users[k].nick||DB.users[k].name)}${badge(DB.users[k])} <button class="btn" onclick="acc('${k}',1)">ACCEPT</button><button class="btn g" onclick="acc('${k}',0)">DECLINE</button></p>`).join('')}</div>`:''}<h2>Players</h2><div id="pres">${pres()}</div><p class="m" style="margin-top:12px">Accounts, follows and friend requests live in this browser (no server), so they work between accounts on this device.</p>`},
call:()=>{const u=me(),fr=u?(u.friends||[]).filter(k=>DB.users[k]):[];return `<h2>Video call</h2><div class="note">Peer-to-peer WebRTC call with no server: you and your friend swap two short codes (Telegram, SMS…). Needs camera/mic permission and a secure page (Live Server or https).</div>${fr.length?`<p class="m">Your friends: ${fr.map(k=>esc(DB.users[k].nick||DB.users[k].name)).join(', ')}</p>`:'<p class="m">Add friends on the Players page to call them.</p>'}<div class="two"><div class="glass"><h3>You</h3><div class="cam"><video id="lv" autoplay muted playsinline></video></div></div><div class="glass"><h3>Friend</h3><div class="cam"><video id="rv" autoplay playsinline></video></div></div></div><div class="glass" style="margin-top:16px"><div class="row"><button class="btn" onclick="cam()">1 · START CAMERA</button><button class="btn c" onclick="mkOffer()">2 · CREATE CALL</button><button class="btn c" onclick="mkAnswer()">2 · ANSWER</button><button class="btn" onclick="finish()">3 · CONNECT</button><button class="btn g" onclick="navigator.clipboard.writeText($('#sg').value).then(()=>toast('Copied'))">COPY</button><button class="btn r" onclick="hang()">HANG UP</button></div><textarea id="sg" rows="4" placeholder="Call code goes here…" style="width:100%;margin-top:10px;background:#0d0b1c;color:#fff;border:1px solid #ffffff22;border-radius:10px;padding:10px;font:11px monospace"></textarea><p class="m">Caller: Create call → copy → send. Friend: paste → Answer → copy → send back. Caller: paste reply → Connect.</p></div>`},
create:()=>{const u=me();u.games=u.games||[];return `<h2>Creator Toolbox</h2><div class="two"><div class="glass"><h3>Build with code</h3><p class="m">One command per line: <b>P x y width</b> platform · <b>C x y</b> coin · <b>S x y width</b> spikes · <b>F x y</b> checkpoint · <b>G x y</b> goal. Test games give no coins.</p><textarea id="cc" rows="9" style="width:100%;background:#0d0b1c;color:#fff;border:1px solid #ffffff22;border-radius:10px;padding:10px;font:12px monospace">${esc(window.CODE||SAMPLE)}</textarea><input id="gn" placeholder="Game name"><div class="row"><button class="btn" onclick="testCode()">▶ PLAY TEST</button><button class="btn c" onclick="saveGame()">SAVE GAME</button></div></div><div class="glass"><h3>My games</h3>${u.games.map((g,i)=>`<p class="row">${esc(g.n)} <button class="btn g" onclick="window.CODE=DB.users[DB.session].games[${i}].c;playCustom(window.CODE)">PLAY</button><button class="btn r" onclick="delGame(${i})">✕</button></p>`).join('')||'<p class="m">No saved games yet.</p>'}<h3 style="margin-top:16px">Free items</h3><p class="m">Builder Bot skin + 50 coins, once per account.</p><button class="btn" ${u.cp?'disabled':''} onclick="claimFree()">${u.cp?'CLAIMED':'CLAIM FREE ITEMS'}</button></div></div><div id="stage"></div>`},
settings:()=>{const u=me();return `<h2>Settings</h2><div class="two"><div class="glass"><h3>Profile</h3><div class="row"><div class="av">${ava(u)}</div><input type="file" accept="image/*" onchange="upImg(this)"></div><p class="m">Nickname (shown to others)</p><input id="sn1" maxlength="20" value="${esc(u.nick||'')}"><p class="m">Username (login name)</p><input id="su" maxlength="16" value="${esc(u.name)}" ${u.owner?'disabled':''}><button class="btn" onclick="saveProf()">SAVE</button><p style="margin-top:12px">Verified badge: ${u.ver?badge({ver:1})+' <b>Verified</b>':'<span class="m">Not verified — only the owner can grant it.</span>'}<br>Tag: ${u.tag?esc(u.tag):'<span class="m">none (the owner can give tags)</span>'}</p></div><div class="glass"><h3>Change password</h3><input id="op" type="password" placeholder="Current password"><input id="np" type="password" placeholder="New password (6+)"><button class="btn c" onclick="chPw()">CHANGE PASSWORD</button><br><br><a class="btn g" href="#studio">🛠 CREATOR STUDIO</a> <a class="btn g" href="#profile">PROFILE &amp; COLOR LAB</a></div></div>`},
home:()=>`<section class="glass hero"><h1>ABUZZY PLAY GAME</h1><div class="tag">PLAY. COLLECT. UNLOCK. DOMINATE.</div><p>Explore exciting parkour worlds, collect coins, unlock legendary skins and become the ultimate ABUZZY player.</p><div class="row" style="justify-content:center"><a class="btn" href="#play">PLAY NOW</a><a class="btn c" href="#shop">EXPLORE SKINS</a><a class="btn g" href="#players">FIND PLAYERS</a></div></section>
${me()&&(me().inc||[]).filter(k=>DB.users[k]).length?`<h2>Friend requests</h2><div class="glass">${me().inc.filter(k=>DB.users[k]).map(k=>`<p class="row">${ava(DB.users[k],28)} ${esc(DB.users[k].nick||DB.users[k].name)} <button class="btn" onclick="acc('${k}',1)">ACCEPT</button><button class="btn g" onclick="acc('${k}',0)">DECLINE</button></p>`).join('')}</div>`:''}<h2>Search players</h2><div class="glass"><input placeholder="🔍 Search by username or nickname…" value="${esc(window.PQ||'')}" oninput="PQ=this.value;$('#pres').innerHTML=pres()"></div><div id="pres" style="margin-top:14px">${pres()}</div><h2>🌐 Online now</h2><div class="glass" id="onl">${onlHtml()}</div><h2>Live leaderboard</h2><div class="glass">${board(10)}</div>`,
play:()=>`<h2>Game modes</h2><div class="grid"><div class="glass card"><div style="font-size:34px">🏃</div><h3 style="font-size:14px">NORMAL</h3><p class="m">Solo parkour — just grab coins. Pick a world below.</p></div><div class="glass card"><div style="font-size:34px">🔫</div><h3 style="font-size:14px">SURVIVAL SOLO</h3><p class="m">Waves of Louis XVIII’s soldiers.</p><button class="btn" onclick="arena('survival')">PLAY</button></div><div class="glass card"><div style="font-size:34px">🤝</div><h3 style="font-size:14px">DUO SURVIVAL</h3><p class="m">AI teammate. Press C to command: attack / follow.</p><button class="btn" onclick="arena('duo')">PLAY</button></div><div class="glass card"><div style="font-size:34px">⚔️</div><h3 style="font-size:14px">RIVALS 1V1</h3><p class="m">Mini duel vs Louis XVIII. First to 5.</p><button class="btn" onclick="arena('rivals')">PLAY</button></div><div class="glass card"><div style="font-size:34px">🌐</div><h3 style="font-size:14px">ONLINE RACE</h3><p class="m">${NET.on?'Live with everyone in the same world:':'Needs the published claude.ai link (the offline file can’t connect).'}</p><div class="row" style="justify-content:center">${[1,2,3,4,5,6].map(n=>`<button class="btn" ${NET.on?'':'disabled'} onclick="goOnline(${n})">W${n}</button>`).join('')}</div></div></div>${comm()}<h2>Choose gun</h2><div class="row">${Object.entries(GUNS).map(([k,g])=>`<button class="btn ${gunId()==k?'c':'g'}" onclick="DB.gun='${k}';save();go()">${g.n} · ${g.d} dmg</button>`).join('')}</div><h2>Parkour worlds</h2><div class="row" style="margin-bottom:12px"><button class="btn ${DB.easy?'c':'g'}" onclick="DB.easy=!DB.easy;save();go()">${DB.easy?'😌 EASY MODE: ON (no spikes, higher jump)':'🔥 NORMAL MODE — tap for easy'}</button></div>${me()?'':'<div class="note">Guest mode: you can play, but coins and progress are only saved when you <a href="#login" style="color:#fff">log in</a>.</div>'}<div class="grid">${[1,2,3,4,5,6].map(n=>{const u=me(),ok=n<=(u?u.lv:1),t=gen(n).C.length,got=u?gen(n).C.filter(c=>u.got[c.id]).length:0;
return `<div class="glass card"><h3>WORLD ${n}</h3><p class="m" style="margin:8px 0">${t} coins · ${got}/${t} collected<br>Difficulty ${'★'.repeat(Math.min(n,5))}</p><button class="btn" ${ok?'':'disabled'} onclick="play(${n})">${ok?'PLAY':'🔒 LOCKED'}</button></div>`}).join('')}</div><div id="stage"></div><p class="m" style="margin-top:12px">A / D or ← → to run · SPACE to jump (press again mid-air to double jump) · Aim with the mouse (or tap the screen) and click, tap or press F to shoot red drones: +5 coins each, first time only. Touch buttons appear on phones.</p>`,
shop:()=>`<h2>Skin shop</h2><div class="grid">${skins().filter(s=>!s.hid||(me()&&me().owned.includes(s.id))).map(s=>skinCard(s,me())).join('')}</div>`,
inv:()=>{const u=me();return `<h2>Inventory</h2>${u.owned.length?`<div class="grid">${skins().filter(s=>u.owned.includes(s.id)).map(s=>skinCard(s,u)).join('')}</div>`:''}<p class="m" style="margin-top:14px">Want more? <a href="#shop" style="color:var(--c)">Visit the Skin Shop</a>.</p>`},
free:()=>{const u=me();return `<h2>Free coins</h2><div class="note">Honest verification notice: following a YouTube channel, Telegram group or Roblox community can only be confirmed by a server using official APIs (${TASKS.map(t=>t.api).join('; ')}). This browser-only build can’t do that, so VERIFY sends your task to an admin for manual review — coins are never awarded just for clicking a link.</div><div class="grid">${TASKS.map(t=>{const st=u&&u.tasks[t.id];
return `<div class="glass card"><div style="font-size:38px">${t.i}</div><h3 style="font-size:15px">${t.n}</h3><p class="m" style="margin:6px 0">${t.t}</p><p class="coin">REWARD +${DB.rw[t.id]} COINS</p><div class="row" style="justify-content:center;margin-top:12px">${st=='done'?'<span class="badge" style="color:#4ade80;border-color:#4ade80">✔ COMPLETED</span>':`<a class="btn g" href="${t.u}" target="_blank" rel="noopener" onclick="visit('${t.id}')">VISIT</a><button class="btn c" ${st=='pending'?'disabled':''} onclick="verify('${t.id}')">${st=='pending'?'IN REVIEW':'VERIFY'}</button>`}</div></div>`}).join('')}</div>`},
board:()=>`<h2>Leaderboard</h2><div class="glass">${board(50)}</div>`,
profile:()=>{const u=me(),s=skin(u.eq);return `<h2>Profile</h2><div class="two"><div class="glass"><div class="row"><div class="av">${ava(u)}</div><div><h3>${esc(u.nick||u.name)}${badge(u)}</h3><p class="m">@${esc(u.name)}${u.owner?' · OWNER':u.admin?' · ADMIN':''}<br>${folc(DB.session)} followers · ${(u.following||[]).length} following · ${(u.friends||[]).length} friends</p></div></div><p style="margin:14px 0">Coins: <b class="coin">${fmt(u.coins)}</b><br>World reached: ${u.lv}<br>Skins owned: ${u.owned.length}<br>Equipped: ${esc(s.name)}<br>Deaths: ${u.deaths}</p><div class="row">${['🎮','🚀','🦊','🐉','👾','⚡','🔥','👑'].map(a=>`<button class="btn g" onclick="av('${a}')">${a}</button>`).join('')}</div><br><button class="btn r" onclick="logout()">LOG OUT</button></div>
<div class="glass"><h3>Telegram</h3><p class="m" style="margin:10px 0">Official Telegram Login sends signed data that a server must verify with your bot token (HMAC-SHA256). Putting that in browser code would leak the token, so linking is disabled in this build rather than faked.</p><button class="btn g" disabled>CONNECT TELEGRAM (needs backend)</button> <a class="btn c" href="https://t.me/ABU_DEVS" target="_blank" rel="noopener">JOIN ABU DEVS</a></div><div class="glass"><h3>Color Lab</h3><p class="m" style="margin:8px 0">Recolor your equipped skin (${esc(s.name)}) with any pair of 16.7 million colors each — about 280 trillion looks per skin.</p>${prev(u.eq)}<div class="row"><input id="k1" type="color" value="${s.c1}" style="width:70px" oninput="setCol()"><input id="k2" type="color" value="${s.c2}" style="width:70px" oninput="setCol()"><button class="btn c" onclick="rndCol()">🎲 RANDOM</button><button class="btn g" onclick="resetCol()">RESET</button></div></div></div>`},
wallet:()=>{const u=me(),rs=DB.redeems.filter(r=>r.u==DB.session);return `<h2>Wallet</h2><div class="grid"><div class="glass"><p class="m">TOTAL COINS</p><h2 class="coin">${fmt(u.coins)}</h2></div><div class="glass"><p class="m">EARNED</p><h2 style="color:#4ade80">${fmt(u.earned)}</h2></div><div class="glass"><p class="m">SPENT</p><h2 style="color:#f87171">${fmt(u.spent)}</h2></div></div>
<div class="two" style="margin-top:16px"><div class="glass"><h3>Redeem coins</h3><p class="coin" style="margin:8px 0">10,000,000 COINS = 20,000 UZS</p><div class="note">Requests are reviewed by an admin. Nothing is paid until the status shows PAID. Needs World 2 unlocked and one open request at a time.</div><input id="ra" type="number" placeholder="Coins (min 10,000,000)" oninput="$('#rc').textContent=fmt((+this.value||0)/500)+' UZS'"><p class="m">You receive: <b id="rc">0 UZS</b></p><input id="rk" placeholder="Card number (16 digits)" inputmode="numeric"><button class="btn" onclick="redeem()">REQUEST REDEMPTION</button>${rs.map(r=>`<p style="margin-top:10px">${fmt(r.a)} coins → ${fmt(r.a/500)} UZS · <b>${r.s.toUpperCase()}</b></p>`).join('')}</div>
<div class="glass"><h3>Transactions</h3><div class="tbl" style="max-height:340px;overflow:auto"><table>${u.tx.map(t=>`<tr><td>${new Date(t.t).toLocaleString()}</td><td>${esc(t.d)}</td><td style="color:${t.a>0?'#4ade80':'#f87171'}">${t.a>0?'+':''}${fmt(t.a)}</td></tr>`).join('')||'<tr><td class="m">No transactions yet.</td></tr>'}</table></div></div></div>`},
login:()=>`<div class="glass" style="max-width:420px;margin:30px auto"><h2 style="margin-top:0">Login / Sign up</h2><input id="un" placeholder="Username" autocomplete="username"><input id="pw" type="password" placeholder="Password (6+ chars)" autocomplete="current-password"><div class="row"><button class="btn" onclick="auth('in')">LOG IN</button><button class="btn c" onclick="auth('up')">SIGN UP</button></div><br><p class="m o" style="font-size:11px;margin:4px 0">SIGN IN WITH</p><div class="row"><button class="btn g" onclick="soc('Google')">G Google</button><button class="btn g" onclick="soc('Telegram')">✈️ Telegram</button><button class="btn g" onclick="soc('Apple')">🍎 Apple</button></div><button class="btn c" style="width:100%;margin-top:10px" onclick="quick()">⚡ QUICK PLAY (instant account)</button><div class="note">Demo build: accounts live in this browser only (passwords salted + SHA-256 hashed). Telegram Login is disabled because it requires server-side verification. The first account created becomes admin.</div></div>`,
admin:()=>{const us=Object.values(DB.users),q=(window.AQ||'').toLowerCase(),sel=DB.users[window.AS];
const pend=[];us.forEach(u=>TASKS.forEach(t=>u.tasks[t.id]=='pending'&&pend.push([u,t])));
return `<h2>ABUZZY ADMIN PANEL</h2><div class="note">Demo only: this panel runs in the browser, so it is NOT secure. A real deployment must enforce admin rights on the server (Supabase RLS + role checks).</div>
<div class="grid"><div class="glass"><p class="m">PLAYERS</p><h2>${us.length}</h2></div><div class="glass"><p class="m">COINS IN CIRCULATION</p><h2 class="coin">${fmt(us.reduce((a,u)=>a+u.coins,0))}</h2></div><div class="glass"><p class="m">PURCHASES</p><h2>${us.reduce((a,u)=>a+u.owned.length-1,0)}</h2></div><div class="glass"><p class="m">PENDING REVIEWS</p><h2>${pend.length+DB.redeems.filter(r=>r.s=='pending').length}</h2></div></div>
<h2>Players</h2><div class="glass"><input placeholder="Search players…" value="${esc(window.AQ||'')}" oninput="AQ=this.value;go()" autofocus><div class="tbl"><table><tr><th>NAME</th><th>COINS</th><th>SKINS</th><th>ACTIONS</th></tr>${us.filter(u=>u.name.toLowerCase().includes(q)).map(u=>`<tr><td>${esc(u.name)}${u.banned?' 🚫':''}</td><td>${fmt(u.coins)}</td><td>${u.owned.length}</td><td class="row"><button class="btn g" onclick="AS='${u.name.toLowerCase()}';go()">VIEW</button><button class="btn g" onclick="adj('${u.name.toLowerCase()}')">±COINS</button><button class="btn r" onclick="ban('${u.name.toLowerCase()}')">${u.banned?'UNBAN':'BAN'}</button>${me().owner?`<button class="btn g" onclick="tag('${u.name.toLowerCase()}')">TAG</button><button class="btn g" onclick="ver('${u.name.toLowerCase()}')">${u.ver?'UNVERIFY':'VERIFY'}</button><button class="btn g" onclick="mkadm('${u.name.toLowerCase()}')">${u.admin?'DEMOTE':'MAKE ADMIN'}</button><button class="btn g" onclick="gskin('${u.name.toLowerCase()}')">+SKIN</button>`:''}</td></tr>`).join('')}</table></div>${sel?`<div class="note" style="color:#fff">${esc(sel.name)} · coins ${fmt(sel.coins)} · world ${sel.lv} · owns: ${sel.owned.join(', ')} · equipped: ${sel.eq}</div>`:''}</div>
<h2>Reviews</h2><div class="glass">${pend.map(([u,t])=>`<p class="row">${esc(u.name)} — ${t.n} task (+${DB.rw[t.id]}) <button class="btn c" onclick="rv('${u.name.toLowerCase()}','${t.id}',1)">APPROVE</button><button class="btn r" onclick="rv('${u.name.toLowerCase()}','${t.id}',0)">REJECT</button></p>`).join('')||'<p class="m">No social tasks waiting.</p>'}
