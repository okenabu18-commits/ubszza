
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roblox Login</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 background:radial-gradient(circle at top,#24385c,#080b12 70%);
 font-family:Arial;color:white
}
.card{
 width:min(420px,92%);padding:35px;
 background:#151b27;border:1px solid #35435b;
 border-radius:20px;text-align:center;
 box-shadow:0 25px 80px #0009
}
.logo{font-size:45px;font-weight:1000;letter-spacing:-4px}
p{color:#a0aec0;font-size:14px;line-height:1.6}
input{
 width:100%;padding:14px;margin-top:12px;
 background:#0b101a;border:1px solid #39465c;
 color:white;border-radius:9px;outline:none
}
button{
 width:100%;padding:16px;margin-top:14px;
 border:0;border-radius:9px;font-weight:bold;
 cursor:pointer;transition:.2s
}
button:hover{transform:translateY(-2px)}
.join{background:white;color:#111}
.sign{background:#335dff;color:white}
#profile{display:none;margin-top:25px}
#profile img{width:85px;height:85px;border-radius:50%}
#message{color:#ffaaaa;font-size:13px;margin-top:12px}
</style>
</head>
<body>
<div class="card">
 <div class="logo">ROBLOX</div>
 <h2>Welcome back!</h2>
 <p>Sign in securely with your Roblox account.</p>

 <input id="clientId" placeholder="Roblox Client ID">

 <button class="join" onclick="login()">JOIN WITH ROBLOX</button>
 <button class="sign" onclick="login()">SIGN IN WITH ROBLOX</button>

 <div id="message"></div>

 <div id="profile">
  <img id="avatar" alt="Roblox avatar">
  <h3 id="username"></h3>
  <p id="userid"></p>
 </div>
</div>
<script>
function login(){
 const clientId=document.getElementById("clientId").value.trim();

 if(!clientId){
  document.getElementById("message").textContent=
   "Please enter your Roblox Client ID.";
  return;
 }

 // The actual OAuth flow must be started by your Vercel backend.
 // Never put a Client Secret or API key in this HTML.
 window.location.href="/api/oauth/roblox/login";
}

async function loadProfile(){
 try{
  const response=await fetch("/api/oauth/roblox/me");
  if(!response.ok)return;
  const data=await response.json();
  if(!data.user)return;

  document.getElementById("profile").style.display="block";
  document.getElementById("username").textContent=
   data.user.username || data.user.displayName;
  document.getElementById("userid").textContent=
   "User ID: "+data.user.id;
  document.getElementById("avatar").src=data.user.avatar || "";
 }catch(e){console.log(e)}
}
loadProfile();
</script>
</body>
</html>
