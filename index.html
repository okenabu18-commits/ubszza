
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roblox Account Login</title>
<style>
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;display:grid;place-items:center;
background:radial-gradient(circle at top,#26334c,#090b12 65%);
font-family:Arial;color:white
}
.card{
width:min(420px,92vw);padding:38px 28px;
background:#151923;border:1px solid #343d50;
border-radius:22px;text-align:center;
box-shadow:0 25px 90px #0009
}
.logo{font-size:48px;font-weight:1000;letter-spacing:-4px}
h2{margin:20px 0 8px}
p{color:#9ca9bd;font-size:14px;line-height:1.6}
button{
width:100%;padding:17px;margin-top:15px;
border:0;border-radius:10px;font-weight:bold;
font-size:14px;cursor:pointer;transition:.2s
}
button:hover{transform:translateY(-3px);filter:brightness(1.15)}
.join{background:#fff;color:#111}
.sign{background:#335fff;color:white}
#profile{display:none;margin-top:25px}
#profile img{width:85px;height:85px;border-radius:50%}
small{color:#8290a5}
</style>
</head>
<body>
<div class="card">
  <div class="logo">ROBLOX</div>
  <h2>Welcome back!</h2>
  <p>Join the experience or sign in with your Roblox account.</p>

  <button class="join" onclick="login()">JOIN WITH ROBLOX</button>
  <button class="sign" onclick="login()">SIGN IN WITH ROBLOX</button>

  <div id="profile">
    <img id="avatar" alt="Roblox avatar">
    <h3 id="username"></h3>
    <small id="userid"></small>
  </div>
  <p style="margin-top:25px"><small>Secure Roblox OAuth sign-in</small></p>
</div>
<script>
/*
  OAuth konfiguratsiyasi:
  O'zingizning backend OAuth endpointingizni kiriting.
  Client secret yoki API keyni bu HTMLga yozmang.
*/
const OAUTH_LOGIN_URL =
  "https://abuzzy.uz/api/oauth/roblox/login";

function login(){
  if(!OAUTH_LOGIN_URL){
    alert("Roblox OAuth backend URL hali sozlanmagan.");
    return;
  }
  location.href = OAUTH_LOGIN_URL;
}

// Backend OAuth callbackdan keyin profilni shu sahifaga
// xavfsiz tarzda uzatishi mumkin.
function showProfile(user){
  document.getElementById("profile").style.display="block";
  document.getElementById("username").textContent=user.username;
  document.getElementById("userid").textContent="User ID: "+user.id;
  document.getElementById("avatar").src=user.avatar;
}
</script>
</body>
</html>
