# Responsive OK.ru TV Player — Fullscreen

```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>TV Player</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

/* =========================
   PLAYER
========================= */

.tv-player {
    width: 100%;
    max-width: 1000px;
    background: #000;
}

/* =========================
   VIDEO
========================= */

.video-box {
    position: relative;

    width: 100%;
    aspect-ratio: 16 / 9;

    background: #000;
    overflow: hidden;
}

/* OK.RU */

.video-box iframe {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    border: 0;

    display: block;
}

/* =========================
   FULLSCREEN BUTTON
========================= */

.fullscreen-btn {

    position: absolute;

    right: 12px;
    bottom: 12px;

    width: 46px;
    height: 46px;

    border: 0;
    border-radius: 10px;

    background: rgba(0,0,0,.75);

    color: white;

    font-size: 24px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    z-index: 100;

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    touch-action: manipulation;

    transition:
        background .15s,
        transform .15s;
}

.fullscreen-btn:hover {
    background: rgba(255,255,255,.18);
}

.fullscreen-btn:active {
    transform: scale(.9);
}

/* =========================
   TOP
========================= */

.top-bar {

    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 65px;

    padding: 18px;

    z-index: 50;

    pointer-events: none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.75),
            transparent
        );
}

.tv-logo {

    display: inline-flex;

    align-items: center;

    gap: 7px;

    color: white;

    font-size: 13px;

    font-weight: 700;
}

.live-dot {

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #ff1744;

    box-shadow:
        0 0 12px #ff1744;
}

/* =========================
   INFO
========================= */

.info {

    padding: 15px;

    background: #0b0b0b;

    color: white;
}

.title {
    font-size: 18px;
    font-weight: 700;
}

.description {
    margin-top: 5px;
    color: #888;
    font-size: 13px;
}

/* =========================
   REAL FULLSCREEN
========================= */

.video-box:fullscreen {

    width: 100vw !important;
    height: 100vh !important;

    max-width: none !important;

    aspect-ratio: auto !important;

    background: #000;

    border-radius: 0;
}

.video-box:-webkit-full-screen {

    width: 100vw !important;
    height: 100vh !important;

    background: #000;

    border-radius: 0;
}

.video-box:fullscreen iframe {

    width: 100vw !important;
    height: 100vh !important;

    position: absolute;

    inset: 0;
}

.video-box:-webkit-full-screen iframe {

    width: 100vw !important;
    height: 100vh !important;

    position: absolute;

    inset: 0;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    body {
        align-items: center;
    }

    .tv-player {
        width: 100vw;
        max-width: none;
    }

    .video-box {
        width: 100vw;
        aspect-ratio: 16 / 9;
    }

    .fullscreen-btn {

        right: 8px;
        bottom: 8px;

        width: 43px;
        height: 43px;

        font-size: 21px;
    }

    .info {
        padding: 12px;
    }

    .title {
        font-size: 16px;
    }

    .description {
        font-size: 12px;
    }
}

/* =========================
   PHONE LANDSCAPE
========================= */

@media (
    max-width: 950px
) and (
    orientation: landscape
) {

    .tv-player {
        width: 100vw;
    }

    .video-box {
        width: 100vw;
        height: 100vh;

        aspect-ratio: auto;
    }

    .video-box iframe {

        width: 100vw;
        height: 100vh;

    }

    .info {
        display: none;
    }

    .fullscreen-btn {
        bottom: 15px;
        right: 15px;
    }
}

/* =========================
   SAFE AREA iPHONE
========================= */

@supports (
    padding: env(safe-area-inset-bottom)
) {

    .fullscreen-btn {

        bottom:
            calc(
                12px +
                env(safe-area-inset-bottom)
            );

    }
}

</style>
</head>

<body>

<div class="tv-player">

    <div
        class="video-box"
        id="videoBox"
    >

        <!--
            ORIGINAL OK.RU PLAYER
            KEEP OK.RU CONTROLS
        -->

        <iframe
            id="okPlayer"

            src="https://ok.ru/videoembed/9548582816350"

            allow="
                autoplay;
                fullscreen;
                picture-in-picture;
                encrypted-media
            "

            allowfullscreen
            webkitallowfullscreen
            mozallowfullscreen
        ></iframe>


        <!-- TOP -->

        <div class="top-bar">

            <div class="tv-logo">

                <span class="live-dot"></span>

                TV

            </div>

        </div>


        <!-- EXTERNAL FULLSCREEN -->

        <button
            id="fullscreenBtn"
            class="fullscreen-btn"
            type="button"
            aria-label="Fullscreen"
        >
            ⛶
        </button>

    </div>


    <div class="info">

        <div class="title">
            TV Player
        </div>

        <div class="description">
            OK.ru Video
        </div>

    </div>

</div>


<script>

/*
=================================================
 FULLSCREEN SYSTEM
 Works with:
 Chrome
 Edge
 Firefox
 Android Chrome
 Samsung Internet
 Safari / iOS fallback
=================================================
*/

const videoBox =
    document.getElementById("videoBox");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const okPlayer =
    document.getElementById("okPlayer");


/* ----------------------------------------------
   CHECK FULLSCREEN
---------------------------------------------- */

function isFullscreen() {

    return (
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement
    );

}


/* ----------------------------------------------
   ENTER FULLSCREEN
---------------------------------------------- */

async function enterFullscreen() {

    try {

        /* Modern browsers */

        if (videoBox.requestFullscreen) {

            await videoBox.requestFullscreen({
                navigationUI: "hide"
            });

            return true;
        }


        /* Safari */

        if (videoBox.webkitRequestFullscreen) {

            videoBox.webkitRequestFullscreen();

            return true;
        }


        /* Firefox */

        if (videoBox.mozRequestFullScreen) {

            videoBox.mozRequestFullScreen();

            return true;
        }


        /* Old Edge */

        if (videoBox.msRequestFullscreen) {

            videoBox.msRequestFullscreen();

            return true;
        }


        /*
        =========================================
        iOS FALLBACK

        The OK.ru iframe itself supports
        native fullscreen through allowfullscreen.

        We focus the iframe so its own player
        controls remain available.
        =========================================
        */

        if (
            /iPhone|iPad|iPod/i.test(
                navigator.userAgent
            )
        ) {

            okPlayer.focus();

            return false;
        }

    } catch (error) {

        console.log(
            "Fullscreen:",
            error
        );

        /*
        Fallback to OK.ru native player
        */

        try {

            okPlayer.focus();

        } catch (_) {}

        return false;
    }

}


/* ----------------------------------------------
   EXIT FULLSCREEN
---------------------------------------------- */

async function exitFullscreen() {

    try {

        if (document.exitFullscreen) {

            await document.exitFullscreen();

            return;
        }

        if (
            document.webkitExitFullscreen
        ) {

            document.webkitExitFullscreen();

            return;
        }

        if (
            document.mozCancelFullScreen
        ) {

            document.mozCancelFullScreen();

            return;
        }

        if (
            document.msExitFullscreen
        ) {

            document.msExitFullscreen();

            return;
        }

    } catch (error) {

        console.log(
            "Exit fullscreen:",
            error
        );

    }

}


/* ----------------------------------------------
   BUTTON
---------------------------------------------- */

fullscreenBtn.addEventListener(
    "click",
    async function(event) {

        event.preventDefault();
        event.stopPropagation();

        if (isFullscreen()) {

            await exitFullscreen();

        } else {

            await enterFullscreen();

        }

    }
);


/* ----------------------------------------------
   KEYBOARD
---------------------------------------------- */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "f") {

            if (isFullscreen()) {

                exitFullscreen();

            } else {

                enterFullscreen();

            }

        }

        if (event.key === "Escape") {

            if (isFullscreen()) {

                exitFullscreen();

            }

        }

    }
);


/* ----------------------------------------------
   FULLSCREEN CHANGE
---------------------------------------------- */

function fullscreenChanged() {

    if (isFullscreen()) {

        fullscreenBtn.innerHTML = "⛶";

    } else {

        fullscreenBtn.innerHTML = "⛶";

    }

}


document.addEventListener(
    "fullscreenchange",
    fullscreenChanged
);

document.addEventListener(
    "webkitfullscreenchange",
    fullscreenChanged
);

document.addEventListener(
    "mozfullscreenchange",
    fullscreenChanged
);

document.addEventListener(
    "MSFullscreenChange",
    fullscreenChanged
);


/* ----------------------------------------------
   DOUBLE TAP / DOUBLE CLICK
---------------------------------------------- */

let lastTap = 0;

videoBox.addEventListener(
    "touchend",
    function() {

        const now = Date.now();

        if (
            now - lastTap < 350
        ) {

            if (isFullscreen()) {

                exitFullscreen();

            } else {

                enterFullscreen();

            }

        }

        lastTap = now;

    },
    {
        passive: true
    }
);

</script>

</body>
</html>
```
