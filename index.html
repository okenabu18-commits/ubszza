
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TV Player</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 15px;
}

/* PLAYER */

.player {
    width: min(1000px, 100%);
    background: #0b0b0b;
    border-radius: 14px;
    overflow: hidden;
    box-shadow:
        0 20px 70px rgba(0,0,0,.7),
        0 0 0 1px rgba(255,255,255,.06);
}

/* VIDEO */

.video-area {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    overflow: hidden;
}

.video-area iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
}

/* TOP */

.top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;

    height: 65px;

    display: flex;
    align-items: center;

    padding: 0 18px;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.8),
            transparent
        );

    z-index: 5;
    pointer-events: none;
}

.live {
    display: flex;
    align-items: center;
    gap: 7px;

    font-size: 13px;
    font-weight: 700;
    letter-spacing: .5px;
}

.live-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ff1744;
    box-shadow: 0 0 12px #ff1744;
}

/* CUSTOM CONTROLS */

.controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;

    height: 70px;

    display: flex;
    align-items: center;
    gap: 8px;

    padding: 20px 15px 8px;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.9),
            transparent
        );

    z-index: 10;
}

/* BUTTON */

.control-btn {
    width: 42px;
    height: 42px;

    border: 0;
    background: transparent;

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    border-radius: 8px;

    font-size: 19px;

    transition:
        background .15s,
        transform .15s;
}

.control-btn:hover {
    background: rgba(255,255,255,.12);
}

.control-btn:active {
    transform: scale(.92);
}

/* SPACER */

.spacer {
    flex: 1;
}

/* SETTINGS */

.settings-wrapper {
    position: relative;
}

.settings-menu {
    position: absolute;

    right: 0;
    bottom: 52px;

    width: 190px;

    background: #181818;

    border: 1px solid rgba(255,255,255,.08);

    border-radius: 10px;

    padding: 7px;

    box-shadow: 0 15px 40px rgba(0,0,0,.7);

    display: none;
}

.settings-menu.show {
    display: block;
}

.settings-title {
    padding: 10px 12px;

    color: #aaa;

    font-size: 12px;
    text-transform: uppercase;
}

.setting {
    width: 100%;

    border: 0;

    background: transparent;

    color: white;

    padding: 11px 12px;

    border-radius: 7px;

    text-align: left;

    cursor: pointer;

    font-size: 14px;
}

.setting:hover {
    background: rgba(255,255,255,.1);
}

/* FULLSCREEN */

.video-area.fullscreen {
    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    aspect-ratio: auto;

    z-index: 999999;

    border-radius: 0;
}

.video-area.fullscreen iframe {
    width: 100%;
    height: 100%;
}

/* TITLE */

.info {
    padding: 15px 18px 18px;
}

.title {
    font-size: 19px;
    font-weight: 700;
}

.subtitle {
    margin-top: 6px;

    color: #888;

    font-size: 13px;
}

/* MOBILE */

@media (max-width: 600px) {

    body {
        padding: 0;
    }

    .player {
        width: 100%;
        border-radius: 0;
    }

    .video-area {
        border-radius: 0;
    }

    .controls {
        height: 60px;
        padding: 15px 8px 5px;
    }

    .control-btn {
        width: 38px;
        height: 38px;
        font-size: 17px;
    }

    .info {
        padding: 12px;
    }

    .title {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="player">

    <div class="video-area" id="videoArea">

        <!-- OK.RU VIDEO -->

        <iframe
            id="okVideo"
            src="https://ok.ru/videoembed/9548582816350"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen>
        </iframe>


        <!-- TOP BAR -->

        <div class="top-bar">
            <div class="live">
                <span class="live-dot"></span>
                TV
            </div>
        </div>


        <!-- CONTROLS -->

        <div class="controls">

            <!-- PLAY BUTTON -->

            <button
                class="control-btn"
                id="playBtn"
                title="Play">
                ▶
            </button>


            <!-- VOLUME -->

            <button
                class="control-btn"
                id="volumeBtn"
                title="Volume">
                🔊
            </button>


            <div class="spacer"></div>


            <!-- SETTINGS -->

            <div class="settings-wrapper">

                <button
                    class="control-btn"
                    id="settingsBtn"
                    title="Settings">
                    ⚙
                </button>

                <div
                    class="settings-menu"
                    id="settingsMenu">

                    <div class="settings-title">
                        Settings
                    </div>

                    <button class="setting">
                        Quality
                        <span style="float:right;color:#888">
                            Auto
                        </span>
                    </button>

                    <button class="setting">
                        Speed
                        <span style="float:right;color:#888">
                            Normal
                        </span>
                    </button>

                    <button class="setting">
                        Subtitles
                        <span style="float:right;color:#888">
                            Off
                        </span>
                    </button>

                </div>

            </div>


            <!-- FULLSCREEN -->

            <button
                class="control-btn"
                id="fullscreenBtn"
                title="Fullscreen">
                ⛶
            </button>

        </div>

    </div>


    <!-- VIDEO INFO -->

    <div class="info">

        <div class="title">
            TV Player
        </div>

        <div class="subtitle">
            OK.ru Video • 1000px Responsive Player
        </div>

    </div>

</div>


<script>

const videoArea =
    document.getElementById("videoArea");

const playBtn =
    document.getElementById("playBtn");

const volumeBtn =
    document.getElementById("volumeBtn");

const settingsBtn =
    document.getElementById("settingsBtn");

const settingsMenu =
    document.getElementById("settingsMenu");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");


/* PLAY */

let playing = false;

playBtn.addEventListener("click", () => {

    /*
      IMPORTANT:
      OK.ru iframe is cross-origin.

      Therefore this button cannot directly
      call the iframe's play() method.

      The OK.ru player's own controls should
      be used for playback.
    */

    playing = !playing;

    playBtn.textContent =
        playing ? "❚❚" : "▶";

});


/* VOLUME */

volumeBtn.addEventListener("click", () => {

    /*
      Volume of the OK.ru iframe cannot be
      directly controlled from this page
      because it is cross-origin.
    */

    volumeBtn.textContent =
        volumeBtn.textContent === "🔊"
            ? "🔇"
            : "🔊";

});


/* SETTINGS */

settingsBtn.addEventListener("click", (event) => {

    event.stopPropagation();

    settingsMenu.classList.toggle("show");

});


/* CLOSE SETTINGS */

document.addEventListener("click", (event) => {

    if (
        !settingsBtn.contains(event.target) &&
        !settingsMenu.contains(event.target)
    ) {

        settingsMenu.classList.remove("show");

    }

});


/* FULLSCREEN */

fullscreenBtn.addEventListener("click", async () => {

    try {

        if (!document.fullscreenElement) {

            if (videoArea.requestFullscreen) {

                await videoArea.requestFullscreen();

            }

            else if (videoArea.webkitRequestFullscreen) {

                videoArea.webkitRequestFullscreen();

            }

        }

        else {

            await document.exitFullscreen();

        }

    }

    catch (error) {

        console.log(
            "Fullscreen error:",
            error
        );

    }

});


/* FULLSCREEN ICON */

document.addEventListener(
    "fullscreenchange",
    () => {

        if (document.fullscreenElement) {

            fullscreenBtn.textContent = "⛶";

        }

        else {

            fullscreenBtn.textContent = "⛶";

        }

    }
);

</script>

</body>
</html>
