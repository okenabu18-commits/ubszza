<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABUZZY</title>

<meta name="description"
content="ABUZZY — Roblox Creator & Developer">

<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#03060b;
    color:white;
    overflow:hidden;
}

/* Background */

body::before,
body::after{
    content:"";
    position:fixed;
    width:300px;
    height:300px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.25;
    animation:float 8s infinite alternate ease-in-out;
}

body::before{
    background:#00e5ff;
    top:-120px;
    left:-100px;
}

body::after{
    background:#7c3aed;
    right:-100px;
    bottom:-120px;
}

@keyframes float{
    to{
        transform:translate(50px,40px) scale(1.2);
    }
}

/* Card */

.card{
    width:100%;
    max-width:430px;
    padding:35px 25px;
    text-align:center;

    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.1);
    border-radius:25px;

    backdrop-filter:blur(20px);

    box-shadow:
        0 20px 80px rgba(0,0,0,.5),
        0 0 40px rgba(0,229,255,.08);

    animation:show .8s ease;
}

@keyframes show{
    from{
        opacity:0;
        transform:translateY(25px) scale(.97);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* Avatar */

.avatar{
    width:100px;
    height:100px;
    border-radius:50%;
    object-fit:cover;

    border:3px solid #00e5ff;

    box-shadow:0 0 30px rgba(0,229,255,.4);

    margin-bottom:18px;
}

/* Name */

h1{
    font-size:32px;
    letter-spacing:-1px;
}

h1 span{
    color:#00e5ff;
}

/* Status */

.status{
    display:inline-flex;
    align-items:center;
    gap:7px;

    margin:12px 0 18px;
    padding:7px 12px;

    border-radius:50px;

    background:rgba(34,197,94,.08);
    border:1px solid rgba(34,197,94,.2);

    color:#86efac;
    font-size:11px;
}

.dot{
    width:7px;
    height:7px;
    background:#22c55e;
    border-radius:50%;
    box-shadow:0 0 10px #22c55e;
}

/* Description */

p{
    color:#8d98aa;
    font-size:14px;
    line-height:1.7;
    margin-bottom:24px;
}

/* Links */

.links{
    display:grid;
    gap:10px;
}

.links a{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    padding:13px;

    border-radius:13px;

    color:white;
    text-decoration:none;

    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.08);

    font-size:14px;
    font-weight:600;

    transition:.3s;
}

.links a:hover{
    transform:translateY(-3px);
    background:#00e5ff;
    color:#001014;

    box-shadow:0 8px 30px rgba(0,229,255,.25);
}

/* Language */

.languages{
    display:flex;
    justify-content:center;
    gap:5px;
    margin-top:20px;
}

.languages button{
    border:0;
    background:transparent;
    color:#657084;
    cursor:pointer;

    padding:6px 9px;
    border-radius:8px;

    font-size:10px;
    font-weight:bold;
}

.languages button.active,
.languages button:hover{
    color:#00e5ff;
    background:rgba(0,229,255,.08);
}

footer{
    margin-top:20px;
    color:#4f596b;
    font-size:10px;
}

@media(max-width:450px){

    .card{
        padding:30px 20px;
    }

    h1{
        font-size:28px;
    }

}

</style>
</head>

<body>

<div class="card">

    <!-- Agar rasm ishlatmoqchi bo'lsang:
    <img src="abuzzy.png" class="avatar">
    -->

    <div style="
        width:100px;
        height:100px;
        margin:0 auto 18px;
        display:grid;
        place-items:center;
        border-radius:50%;
        border:3px solid #00e5ff;
        color:#00e5ff;
        font-size:38px;
        font-weight:800;
        box-shadow:0 0 30px rgba(0,229,255,.4);
    ">s
        <img src="/logo.png" class="avatar">
    </div>

    <h1>ABUZZY<span>,</span></h1>

    <div class="status">
        <span class="dot"></span>
        <span id="status">ONLINE</span>
    </div>

    <p id="about">
        Roblox Creator & Developer.
        I build games, websites and creative digital experiences.
    </p>

  <div class="links">

    <a href="https://instagram.com/dev_roro" target="_blank">
        <i class="fab fa-instagram"></i>
        instagram
    </a>

    <a href="https://github.com/okenabu18-commits" target="_blank">
        <i class="fab fa-github"></i>
        github
    </a>

    <a href="https://discord.gg/kKJcYU6sX" target="_blank">
        <i class="fab fa-discord"></i>
        discord
    </a>

    <a href="#" target="_blank">
        <i class="fab fa-telegram"></i>
        telegram
    </a>

    <a href="https://www.roblox.com/games/108520005363467/Abuzzy" target="_blank">
        <i class="fas fa-gamepad"></i>
        roblox
    </a>

</div>


    <footer>
        © 2026 ABUZZY_DEV
    </footer>

</div>

<script>

const text = {

    uz:{
        status:"ONLINE",
        about:"Men Roblox Creator va Developer-man. O‘yinlar, web saytlar va kreativ digital loyihalar yarataman."
    },

    en:{
        status:"ONLINE",
        about:"I'm a Roblox Creator and Developer. I build games, websites and creative digital experiences."
    },

    ru:{
        status:"ОНЛАЙН",
        about:"Я Roblox Creator и Developer. Создаю игры, сайты и креативные цифровые проекты."
    }

};

function lang(language,button){

    document.getElementById("status").textContent =
        text[language].status;

    document.getElementById("about").textContent =
        text[language].about;

    document.querySelectorAll(".languages button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    localStorage.setItem("language",language);
}

const saved = localStorage.getItem("language");

if(saved){

    const button =
        [...document.querySelectorAll(".languages button")]
        .find(btn => btn.textContent.toLowerCase() === saved);

    if(button){
        lang(saved,button);
    }

}

</script>

</body>
</html>
