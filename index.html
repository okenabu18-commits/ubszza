
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
>

<title>TV Player</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;

    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

/* =========================
   PLAYER
========================= */

.tv-player {
    width: 100%;
    max-width: 1000px;

    background: #000;
}

/* =========================
   VIDEO
========================= */

.video-box {

    position: relative;

    width: 100%;
    aspect-ratio: 16 / 9;

    background: #000;

    overflow: hidden;
}

.video-box iframe {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    border: 0;

    display: block;
}


/* =========================
   TOP TV LABEL
========================= */

.top-bar {

    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 70px;

    padding: 18px;

    z-index: 20;

    pointer-events: none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.75),
            transparent
        );
}

.tv-label {

    display: flex;

    align-items: center;

    gap: 8px;

    color: #fff;

    font-size: 13px;

    font-weight: 700;
}

.live-dot {

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #ff1744;

    box-shadow:
        0 0 12px #ff1744;
}


/* =========================
   FULLSCREEN BUTTON
========================= */

.fullscreen-btn {

    position: absolute;

    right: 12px;
    bottom: 12px;

    width: 46px;
    height: 46px;

    border: none;

    border-radius: 10px;

    background: rgba(0,0,0,.78);

    color: #fff;

    font-size: 24px;

    cursor: pointer;

    z-index: 100;

    display: flex;

    align-items: center;
    justify-content: center;

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    touch-action: manipulation;

    user-select: none;

    transition:
        background .15s,
        transform .15s;
}

.fullscreen-btn:hover {

    background:
        rgba(255,255,255,.18);
}

.fullscreen-btn:active {

    transform: scale(.90);
}


/* =========================
   INFO
========================= */

.info {

    padding: 15px;

    background: #0b0b0b;

    color: #fff;
}

.title {

    font-size: 18px;

    font-weight: 700;
}

.description {

    margin-top: 5px;

    color: #888;

    font-size: 13px;
}


/* =========================
   FULLSCREEN
========================= */

.video-box:fullscreen {

    position: fixed !important;

    inset: 0 !important;

    width: 100vw !important;
    height: 100vh !important;

    max-width: none !important;

    aspect-ratio: auto !important;

    background: #000 !important;

    border-radius: 0 !important;
}

.video-box:fullscreen iframe {

    position: absolute !important;

    inset: 0 !important;

    width: 100vw !important;
    height: 100vh !important;

    border: 0 !important;
}


/* WEBKIT FULLSCREEN */

.video-box:-webkit-full-screen {

    width: 100vw !important;
    height: 100vh !important;

    background: #000 !important;

    border-radius: 0 !important;
}

.video-box:-webkit-full-screen iframe {

    width: 100vw !important;
    height: 100vh !important;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    body {

        width: 100vw;
        min-height: 100vh;

        padding: 0;
    }

    .tv-player {

        width: 100vw;

        max-width: none;
    }

    .video-box {

        width: 100vw;

        aspect-ratio: 16 / 9;
    }

    .fullscreen-btn {

        width: 43px;
        height: 43px;

        right: 9px;
        bottom: 9px;

        font-size: 21px;
    }

    .info {

        padding: 12px;
    }

    .title {

        font-size: 16px;
    }

    .description {

        font-size: 12px;
    }
}


/* =========================
   LANDSCAPE PHONE
========================= */

@media (
    max-width: 950px
) and (
    orientation: landscape
) {

    body {

        width: 100vw;
        height: 100vh;

        padding: 0;
    }

    .tv-player {

        width: 100vw;
        height: 100vh;

        max-width: none;
    }

    .video-box {

        width: 100vw;
        height: 100vh;

        aspect-ratio: auto;
    }

    .video-box iframe {

        width: 100vw;
        height: 100vh;
    }

    .info {

        display: none;
    }

    .fullscreen-btn {

        right: 15px;
        bottom: 15px;
    }
}


/* =========================
   SAFE AREA
========================= */

@supports (
    padding: env(safe-area-inset-bottom)
) {

    .fullscreen-btn {

        bottom:
            calc(
                10px +
                env(safe-area-inset-bottom)
            );
    }
}

</style>
</head>


<body>


<div class="tv-player">


    <!-- VIDEO -->

    <div
        class="video-box"
        id="videoBox"
    >


        <!-- =====================
             OK.RU PLAYER
        ====================== -->

        <iframe

            id="okPlayer"

            src="https://ok.ru/videoembed/9548582816350"

            title="TV Video"

            allow="
                autoplay;
                fullscreen;
                picture-in-picture;
                encrypted-media
            "

            allowfullscreen

            webkitallowfullscreen

            mozallowfullscreen

        ></iframe>


        <!-- =====================
             TV LABEL
        ====================== -->

        <div class="top-bar">

            <div class="tv-label">

                <span class="live-dot"></span>

                TV

            </div>

        </div>


        <!-- =====================
             FULLSCREEN
        ====================== -->

        <button
            id="fullscreenBtn"
            class="fullscreen-btn"
            type="button"
            aria-label="Fullscreen"
        >
            ⛶
        </button>


    </div>


    <!-- =====================
         INFORMATION
    ====================== -->

    <div class="info">

        <div class="title">
            TV Player
        </div>

        <div class="description">
            OK.ru Video
        </div>

    </div>


</div>



<script>

/*
==================================================
 FULLSCREEN SYSTEM
==================================================
*/

const videoBox =
    document.getElementById(
        "videoBox"
    );

const fullscreenBtn =
    document.getElementById(
        "fullscreenBtn"
    );

const okPlayer =
    document.getElementById(
        "okPlayer"
    );


/*
==================================================
 CHECK FULLSCREEN
==================================================
*/

function isFullscreen() {

    return !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement
    );

}


/*
==================================================
 LOCK LANDSCAPE
==================================================
*/

async function lockLandscape() {

    try {

        if (
            screen.orientation &&
            screen.orientation.lock
        ) {

            await screen.orientation.lock(
                "landscape"
            );

            return true;
        }

    } catch (error) {

        console.log(
            "Landscape lock unavailable:",
            error
        );

    }

    return false;

}


/*
==================================================
 UNLOCK ORIENTATION
==================================================
*/

function unlockOrientation() {

    try {

        if (
            screen.orientation &&
            screen.orientation.unlock
        ) {

            screen.orientation.unlock();

        }

    } catch (error) {}

}


/*
==================================================
 ENTER FULLSCREEN
==================================================
*/

async function enterFullscreen() {

    try {

        /*
        Modern browsers
        */

        if (
            videoBox.requestFullscreen
        ) {

            await videoBox.requestFullscreen({
                navigationUI: "hide"
            });

        }

        /*
        Safari / WebKit
        */

        else if (
            videoBox.webkitRequestFullscreen
        ) {

            videoBox.webkitRequestFullscreen();

        }

        /*
        Firefox
        */

        else if (
            videoBox.mozRequestFullScreen
        ) {

            videoBox.mozRequestFullScreen();

        }

        /*
        Old MS browsers
        */

        else if (
            videoBox.msRequestFullscreen
        ) {

            videoBox.msRequestFullscreen();

        }

        /*
        If browser does not support
        wrapper fullscreen, focus OK.ru.
        */

        else {

            okPlayer.focus();

        }


        /*
        IMPORTANT:

        Try to rotate the phone AFTER
        fullscreen has started.
        */

        await lockLandscape();


    } catch (error) {

        console.log(
            "Fullscreen error:",
            error
        );

        /*
        Try native OK.ru player
        */

        try {

            okPlayer.focus();

        } catch (_) {}

    }

}


/*
==================================================
 EXIT FULLSCREEN
==================================================
*/

async function exitFullscreen() {

    try {

        if (
            document.exitFullscreen
        ) {

            await document.exitFullscreen();

        }

        else if (
            document.webkitExitFullscreen
        ) {

            document.webkitExitFullscreen();

        }

        else if (
            document.mozCancelFullScreen
        ) {

            document.mozCancelFullScreen();

        }

        else if (
            document.msExitFullscreen
        ) {

            document.msExitFullscreen();

        }

    } catch (error) {

        console.log(
            "Exit fullscreen:",
            error
        );

    }


    unlockOrientation();

}


/*
==================================================
 FULLSCREEN BUTTON
==================================================
*/

fullscreenBtn.addEventListener(
    "click",
    async function(event) {

        event.preventDefault();

        event.stopPropagation();


        if (isFullscreen()) {

            await exitFullscreen();

        } else {

            await enterFullscreen();

        }

    }
);


/*
==================================================
 FULLSCREEN CHANGE
==================================================
*/

function fullscreenChanged() {

    if (isFullscreen()) {

        fullscreenBtn.textContent = "⛶";

    }

    else {

        fullscreenBtn.textContent = "⛶";

        unlockOrientation();

    }

}


document.addEventListener(
    "fullscreenchange",
    fullscreenChanged
);

document.addEventListener(
    "webkitfullscreenchange",
    fullscreenChanged
);

document.addEventListener(
    "mozfullscreenchange",
    fullscreenChanged
);

document.addEventListener(
    "MSFullscreenChange",
    fullscreenChanged
);


/*
==================================================
 KEYBOARD F
==================================================
*/

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key.toLowerCase() === "f"
        ) {

            if (isFullscreen()) {

                exitFullscreen();

            } else {

                enterFullscreen();

            }

        }

    }
);


/*
==================================================
 ESC
==================================================
*/

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            if (isFullscreen()) {

                exitFullscreen();

            }

        }

    }
);


/*
==================================================
 DOUBLE TAP
==================================================
*/

let lastTap = 0;

videoBox.addEventListener(
    "touchend",
    function() {

        const now = Date.now();

        if (
            now - lastTap < 350
        ) {

            if (isFullscreen()) {

                exitFullscreen();

            } else {

                enterFullscreen();

            }

        }

        lastTap = now;

    },
    {
        passive: true
    }
);

</script>

</body>
</html>
