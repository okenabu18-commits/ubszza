
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1.0,
           maximum-scale=1.0,
           viewport-fit=cover"
>

<title>TV Player</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

/* PLAYER */

.player {
    width: min(1000px, 100vw);
    background: #080808;
    overflow: hidden;
}

/* VIDEO */

.video-box {
    position: relative;

    width: 100%;
    aspect-ratio: 16 / 9;

    background: #000;
}

video {
    width: 100%;
    height: 100%;

    display: block;

    background: #000;

    object-fit: contain;
}

/* TOP */

.top {
    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 70px;

    padding: 18px;

    pointer-events: none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.8),
            transparent
        );
}

.logo {
    display: flex;
    align-items: center;
    gap: 8px;

    font-size: 13px;
    font-weight: bold;
}

.dot {
    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #f22;

    box-shadow: 0 0 12px #f22;
}

/* CUSTOM CONTROLS */

.controls {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding: 10px 12px;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.95),
            transparent
        );

    display: flex;
    align-items: center;
    gap: 7px;

    opacity: 0;

    transition: opacity .2s;

    z-index: 20;
}

.video-box:hover .controls,
.video-box:focus-within .controls {
    opacity: 1;
}

/* BUTTON */

button {
    border: 0;

    background: transparent;

    color: white;

    cursor: pointer;

    touch-action: manipulation;
}

.control {
    width: 40px;
    height: 40px;

    border-radius: 8px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 18px;
}

.control:hover {
    background: rgba(255,255,255,.15);
}

/* PROGRESS */

.progress-wrap {
    flex: 1;

    display: flex;
    align-items: center;

    min-width: 50px;
}

#progress {
    width: 100%;

    height: 4px;

    cursor: pointer;

    accent-color: #fff;
}

/* TIME */

.time {
    min-width: 85px;

    text-align: center;

    font-size: 12px;

    color: #ddd;
}

/* SETTINGS */

.settings {
    position: relative;
}

.menu {
    position: absolute;

    right: 0;
    bottom: 48px;

    width: 190px;

    padding: 7px;

    background: #181818;

    border: 1px solid #333;

    border-radius: 10px;

    display: none;

    box-shadow: 0 15px 40px rgba(0,0,0,.7);
}

.menu.open {
    display: block;
}

.menu-title {
    padding: 9px 10px;

    color: #999;

    font-size: 11px;

    text-transform: uppercase;
}

.menu button {
    width: 100%;

    padding: 11px;

    text-align: left;

    border-radius: 7px;

    font-size: 14px;
}

.menu button:hover {
    background: #292929;
}

/* INFO */

.info {
    padding: 15px;

    background: #0b0b0b;
}

.title {
    font-size: 18px;
    font-weight: bold;
}

.sub {
    margin-top: 5px;

    color: #888;

    font-size: 13px;
}

/* FULLSCREEN */

.video-box:fullscreen {
    width: 100vw !important;
    height: 100vh !important;

    aspect-ratio: auto !important;

    background: #000;
}

.video-box:-webkit-full-screen {
    width: 100vw !important;
    height: 100vh !important;

    background: #000;
}

.video-box:fullscreen video,
.video-box:-webkit-full-screen video {
    width: 100vw !important;
    height: 100vh !important;

    object-fit: contain;
}

/* MOBILE */

@media (max-width: 600px) {

    .player {
        width: 100vw;
    }

    .controls {
        opacity: 1;

        padding:
            7px
            8px
            calc(7px + env(safe-area-inset-bottom));
    }

    .control {
        width: 36px;
        height: 36px;

        font-size: 16px;
    }

    .time {
        min-width: 65px;

        font-size: 10px;
    }

    .info {
        padding: 12px;
    }

    .title {
        font-size: 16px;
    }
}

/* LANDSCAPE PHONE */

@media (
    max-width: 950px
) and (
    orientation: landscape
) {

    body {
        width: 100vw;
        height: 100vh;
    }

    .player {
        width: 100vw;
        height: 100vh;
    }

    .video-box {
        width: 100vw;
        height: 100vh;

        aspect-ratio: auto;
    }

    video {
        width: 100vw;
        height: 100vh;
    }

    .info {
        display: none;
    }
}
</style>
</head>

<body>

<div class="player">

    <div
        class="video-box"
        id="videoBox"
    >

        <!--
        ==========================================
        PUT YOUR OWN / LICENSED VIDEO URL HERE
        ==========================================
        -->

        <video
            id="video"
            preload="metadata"
            playsinline
            webkit-playsinline
        >
            <source
                src="https://ok.ru/videoembed/9548582816350"
                type="video/mp4"
            >

            Your browser does not support video.
        </video>


        <!-- TOP -->

        <div class="top">

            <div class="logo">

                <span class="dot"></span>

                TV

            </div>

        </div>


        <!-- CONTROLS -->

        <div class="controls">

            <!-- PLAY -->

            <button
                class="control"
                id="play"
                title="Play / Pause"
            >
                ▶
            </button>


            <!-- VOLUME -->

            <button
                class="control"
                id="mute"
                title="Mute"
            >
                🔊
            </button>


            <!-- PROGRESS -->

            <div class="progress-wrap">

                <input
                    id="progress"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                >

            </div>


            <!-- TIME -->

            <div
                class="time"
                id="time"
            >
                00:00 / 00:00
            </div>


            <!-- SETTINGS -->

            <div class="settings">

                <button
                    class="control"
                    id="settingsBtn"
                    title="Settings"
                >
                    ⚙
                </button>


                <div
                    class="menu"
                    id="settingsMenu"
                >

                    <div class="menu-title">
                        Settings
                    </div>


                    <button data-speed="0.5">
                        Speed&nbsp;&nbsp; 0.5x
                    </button>

                    <button data-speed="1">
                        Speed&nbsp;&nbsp; Normal
                    </button>

                    <button data-speed="1.5">
                        Speed&nbsp;&nbsp; 1.5x
                    </button>

                    <button data-speed="2">
                        Speed&nbsp;&nbsp; 2x
                    </button>

                </div>

            </div>


            <!-- FULLSCREEN -->

            <button
                class="control"
                id="fullscreen"
                title="Fullscreen"
            >
                ⛶
            </button>

        </div>

    </div>


    <div class="info">

        <div class="title">
            TV Player
        </div>

        <div class="sub">
            1000px Responsive • Landscape Fullscreen
        </div>

    </div>

</div>


<script>

/* ==========================================
   ELEMENTS
========================================== */

const video =
    document.getElementById("video");

const videoBox =
    document.getElementById("videoBox");

const play =
    document.getElementById("play");

const mute =
    document.getElementById("mute");

const progress =
    document.getElementById("progress");

const time =
    document.getElementById("time");

const fullscreen =
    document.getElementById("fullscreen");

const settingsBtn =
    document.getElementById("settingsBtn");

const settingsMenu =
    document.getElementById("settingsMenu");


/* ==========================================
   FORMAT TIME
========================================== */

function formatTime(seconds) {

    if (!Number.isFinite(seconds)) {
        return "00:00";
    }

    const hours =
        Math.floor(seconds / 3600);

    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );

    const secs =
        Math.floor(seconds % 60);

    if (hours > 0) {

        return (
            String(hours).padStart(2, "0")
            + ":" +
            String(minutes).padStart(2, "0")
            + ":" +
            String(secs).padStart(2, "0")
        );

    }

    return (
        String(minutes).padStart(2, "0")
        + ":" +
        String(secs).padStart(2, "0")
    );
}


/* ==========================================
   PLAY / PAUSE
========================================== */

play.addEventListener(
    "click",
    async () => {

        if (video.paused) {

            try {

                await video.play();

            } catch (error) {

                console.log(error);

            }

        } else {

            video.pause();

        }

    }
);


video.addEventListener(
    "play",
    () => {

        play.textContent = "❚❚";

    }
);


video.addEventListener(
    "pause",
    () => {

        play.textContent = "▶";

    }
);


/* ==========================================
   MUTE
========================================== */

mute.addEventListener(
    "click",
    () => {

        video.muted =
            !video.muted;

        mute.textContent =
            video.muted
                ? "🔇"
                : "🔊";

    }
);


/* ==========================================
   PROGRESS
========================================== */

video.addEventListener(
    "timeupdate",
    () => {

        if (!video.duration) {
            return;
        }

        progress.value =
            (
                video.currentTime /
                video.duration
            ) * 100;

        time.textContent =
            formatTime(video.currentTime)
            + " / " +
            formatTime(video.duration);

    }
);


progress.addEventListener(
    "input",
    () => {

        if (!video.duration) {
            return;
        }

        video.currentTime =
            (
                Number(progress.value) /
                100
            ) * video.duration;

    }
);


/* ==========================================
   SETTINGS
========================================== */

settingsBtn.addEventListener(
    "click",
    (event) => {

        event.stopPropagation();

        settingsMenu.classList.toggle(
            "open"
        );

    }
);


document.addEventListener(
    "click",
    () => {

        settingsMenu.classList.remove(
            "open"
        );

    }
);


document.querySelectorAll(
    "[data-speed]"
).forEach(
    button => {

        button.addEventListener(
            "click",
            (event) => {

                event.stopPropagation();

                video.playbackRate =
                    Number(
                        button.dataset.speed
                    );

                settingsMenu.classList.remove(
                    "open"
                );

            }
        );

    }
);


/* ==========================================
   FULLSCREEN CHECK
========================================== */

function isFullscreen() {

    return !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement
    );

}


/* ==========================================
   LANDSCAPE
========================================== */

async function lockLandscape() {

    try {

        if (
            screen.orientation &&
            screen.orientation.lock
        ) {

            await screen.orientation.lock(
                "landscape"
            );

            return true;
        }

    } catch (error) {

        console.log(
            "Landscape unavailable:",
            error
        );

    }

    return false;
}


/* ==========================================
   UNLOCK
========================================== */

function unlockOrientation() {

    try {

        if (
            screen.orientation &&
            screen.orientation.unlock
        ) {

            screen.orientation.unlock();

        }

    } catch (error) {}

}


/* ==========================================
   ENTER FULLSCREEN
========================================== */

async function enterFullscreen() {

    try {

        if (
            videoBox.requestFullscreen
        ) {

            await videoBox.requestFullscreen({
                navigationUI: "hide"
            });

        }

        else if (
            videoBox.webkitRequestFullscreen
        ) {

            videoBox.webkitRequestFullscreen();

        }

        else if (
            videoBox.mozRequestFullScreen
        ) {

            videoBox.mozRequestFullScreen();

        }

        else if (
            videoBox.msRequestFullscreen
        ) {

            videoBox.msRequestFullscreen();

        }


        /*
        Try landscape AFTER fullscreen.
        */

        await lockLandscape();

    }

    catch (error) {

        console.log(
            "Fullscreen error:",
            error
        );

    }

}


/* ==========================================
   EXIT FULLSCREEN
========================================== */

async function exitFullscreen() {

    try {

        if (
            document.exitFullscreen
        ) {

            await document.exitFullscreen();

        }

        else if (
            document.webkitExitFullscreen
        ) {

            document.webkitExitFullscreen();

        }

        else if (
            document.mozCancelFullScreen
        ) {

            document.mozCancelFullScreen();

        }

        else if (
            document.msExitFullscreen
        ) {

            document.msExitFullscreen();

        }

    }

    catch (error) {

        console.log(error);

    }

    unlockOrientation();

}


/* ==========================================
   FULLSCREEN BUTTON
========================================== */

fullscreen.addEventListener(
    "click",
    async () => {

        if (isFullscreen()) {

            await exitFullscreen();

        } else {

            await enterFullscreen();

        }

    }
);


/* ==========================================
   FULLSCREEN CHANGE
========================================== */

document.addEventListener(
    "fullscreenchange",
    () => {

        if (!isFullscreen()) {

            unlockOrientation();

        }

    }
);


document.addEventListener(
    "webkitfullscreenchange",
    () => {

        if (!isFullscreen()) {

            unlockOrientation();

        }

    }
);


/* ==========================================
   DOUBLE TAP MOBILE
========================================== */

let lastTap = 0;

videoBox.addEventListener(
    "touchend",
    () => {

        const now =
            Date.now();

        if (
            now - lastTap < 350
        ) {

            if (isFullscreen()) {

                exitFullscreen();

            } else {

                enterFullscreen();

            }

        }

        lastTap = now;

    },
    {
        passive: true
    }
);


/* ==========================================
   KEYBOARD
========================================== */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key.toLowerCase() === "f"
        ) {

            if (isFullscreen()) {

                exitFullscreen();

            } else {

                enterFullscreen();

            }

        }


        if (
            event.key === " "
            &&
            document.activeElement.tagName
                !== "INPUT"
        ) {

            event.preventDefault();

            if (video.paused) {

                video.play();

            } else {

                video.pause();

            }

        }

    }
);


/* ==========================================
   VIDEO READY
========================================== */

video.addEventListener(
    "loadedmetadata",
    () => {

        time.textContent =
            "00:00 / " +
            formatTime(video.duration);

    }
);

</script>

</body>
</html>
