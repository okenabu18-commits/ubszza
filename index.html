<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABU TV</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    background:#0d0d0d;
    border-bottom:1px solid #222;
}

.logo{
    color:#00aaff;
    font-size:26px;
    font-weight:900;
}

.header-buttons{
    display:flex;
    gap:10px;
}

button{
    border:0;
    background:#191919;
    color:white;
    border:1px solid #303030;
    border-radius:9px;
    padding:11px 15px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#00aaff;
}

main{
    max-width:1500px;
    margin:auto;
    padding:25px;
}

.player{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:15px;
    overflow:hidden;
}

iframe{
    width:100%;
    height:100%;
    border:0;
}

.player-tools{
    position:absolute;
    right:15px;
    top:15px;
    z-index:10;
    display:flex;
    gap:8px;
}

.player-tools button{
    width:44px;
    height:44px;
    padding:0;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(8px);
}

/* SETTINGS */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

.overlay.show{
    display:flex;
}

.settings{
    width:400px;
    max-width:90%;
    background:#111;
    border:1px solid #333;
    border-radius:16px;
    overflow:hidden;
}

.settings-header{
    padding:20px;
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid #292929;
}

.settings-row{
    padding:18px 20px;
    border-bottom:1px solid #222;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.settings-row span{
    color:#aaa;
    font-size:13px;
}

select{
    background:#222;
    color:white;
    border:1px solid #444;
    padding:8px;
    border-radius:7px;
}

.info{
    padding:22px 5px;
}

.title{
    font-size:30px;
    font-weight:800;
    margin-bottom:12px;
}

.meta{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.badge{
    padding:8px 12px;
    background:#121212;
    border:1px solid #292929;
    border-radius:8px;
    color:#aaa;
}

.episodes{
    margin-top:20px;
}

.episodes h2{
    margin-bottom:15px;
}

.episode{
    width:180px;
    padding:16px;
    background:#111;
    border:1px solid #292929;
    border-radius:10px;
}

.episode.active{
    border-color:#00aaff;
    background:#08202c;
}

footer{
    text-align:center;
    padding:35px;
    color:#555;
}

/* FULLSCREEN */

body.fullscreen-mode header,
body.fullscreen-mode .info,
body.fullscreen-mode .episodes,
body.fullscreen-mode footer{
    display:none;
}

body.fullscreen-mode main{
    padding:0;
    max-width:none;
}

body.fullscreen-mode .player{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    border-radius:0;
    z-index:5000;
}

/* MOBILE */

@media(max-width:700px){

    header{
        height:60px;
        padding:0 12px;
    }

    .logo{
        font-size:21px;
    }

    main{
        padding:10px;
    }

    .title{
        font-size:22px;
    }

    .player{
        border-radius:8px;
    }

}
</style>
</head>

<body>

<header>

    <div class="logo">
        ABU TV
    </div>

    <div class="header-buttons">

        <button id="settingsBtn">
            ⚙
        </button>

        <button id="fullscreenBtn">
            ⛶
        </button>

    </div>

</header>


<main>

    <div class="player" id="player">

        <div class="player-tools">

            <button id="settingsPlayer">
                ⚙
            </button>

            <button id="fullscreenPlayer">
                ⛶
            </button>

        </div>

        <iframe
            id="okPlayer"
            src="https://ok.ru/videoembed/9931741530647"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen>
        </iframe>

    </div>


    <div class="info">

        <div class="title">
            Bergen HD
        </div>

        <div class="meta">

            <div class="badge">
                🎬 Film
            </div>

            <div class="badge">
                HD
            </div>

            <div class="badge">
                ⏱ 2:22:15
            </div>

        </div>

    </div>


    <section class="episodes">

        <h2>📺 Qismlar</h2>

        <div class="episode active">
            <b>1-qism</b>
            <br>
            <small>2:22:15</small>
        </div>

    </section>

</main>


<footer>
    ABU TV © 2026
</footer>


<!-- SETTINGS -->

<div class="overlay" id="overlay">

    <div class="settings">

        <div class="settings-header">

            <h2>⚙ Settings</h2>

            <button id="closeSettings">
                ×
            </button>

        </div>


        <div class="settings-row">

            <div>
                <b>Fullscreen</b>
                <br>
                <span>Playerni to‘liq ekran qilish</span>
            </div>

            <button id="settingsFullscreen">
                ⛶
            </button>

        </div>


        <div class="settings-row">

            <div>
                <b>Player</b>
                <br>
                <span>OK.ru video player</span>
            </div>

            <select>
                <option>Auto</option>
                <option>720p</option>
                <option>1080p</option>
            </select>

        </div>

    </div>

</div>


<script>

const player =
    document.getElementById("player");

const overlay =
    document.getElementById("overlay");


function openSettings(){

    overlay.classList.add("show");

}


function closeSettings(){

    overlay.classList.remove("show");

}


function fullscreen(){

    if(document.fullscreenElement){

        document.exitFullscreen();

        document.body.classList.remove(
            "fullscreen-mode"
        );

        return;
    }

    if(player.requestFullscreen){

        player.requestFullscreen();

    }else{

        document.body.classList.add(
            "fullscreen-mode"
        );

    }

}


document
    .getElementById("settingsBtn")
    .onclick = openSettings;

document
    .getElementById("settingsPlayer")
    .onclick = openSettings;

document
    .getElementById("closeSettings")
    .onclick = closeSettings;


document
    .getElementById("fullscreenBtn")
    .onclick = fullscreen;

document
    .getElementById("fullscreenPlayer")
    .onclick = fullscreen;

document
    .getElementById("settingsFullscreen")
    .onclick = function(){

        closeSettings();
        fullscreen();

    };


overlay.onclick = function(e){

    if(e.target === overlay){

        closeSettings();

    }

};


/* TV KEYBOARD */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "F11" || e.key.toLowerCase() === "f"){

            fullscreen();

        }

        if(e.key.toLowerCase() === "s"){

            openSettings();

        }

        if(e.key === "Escape"){

            closeSettings();

        }

    }
);

</script>

</body>
</html>
