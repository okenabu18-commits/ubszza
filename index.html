  <meta charset="UTF-8">

  <meta name="description" content="Abuzzy — developer, creator and technology enthusiast.">
  <title>Abuzzy | Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root { color-scheme: dark; --cyan:#22d3ee; --purple:#8b5cf6; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      min-height:100svh; display:grid; place-items:center; padding:28px 16px;
      overflow-x:hidden; background:#050816; color:#f8fafc;
      font-family:Inter,system-ui,sans-serif; position:relative; isolation:isolate;
    }
    body::before, body::after {
      content:""; position:fixed; width:340px; height:340px; border-radius:50%;
      filter:blur(110px); opacity:.42; z-index:-1; pointer-events:none;
      animation:drift 10s ease-in-out infinite alternate;
    }
    body::before { background:#0891b2; top:-150px; left:-130px; }
    body::after { background:#6d28d9; bottom:-170px; right:-120px; animation-delay:-4s; }
    @keyframes drift { to { transform:translate(35px,28px) scale(1.18); } }
    .card {
      width:min(100%,410px); padding:34px 27px 27px; text-align:center;
      border:1px solid rgba(255,255,255,.13); border-radius:28px;
      background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.045));
      backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
      box-shadow:0 24px 90px rgba(0,0,0,.38),0 0 45px rgba(34,211,238,.09);
      animation:enter .75s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes enter { from { opacity:0; transform:translateY(22px) scale(.98); } to { opacity:1; transform:none; } }
    .avatar-wrap { width:112px; height:112px; margin:0 auto 17px; padding:3px; border-radius:50%;
      background:linear-gradient(135deg,var(--cyan),var(--purple)); box-shadow:0 0 28px #22d3ee55; }
    .avatar { width:100%; height:100%; display:block; object-fit:cover; border-radius:50%; border:3px solid #080d1c; }
    .eyebrow { display:inline-flex; align-items:center; gap:7px; color:#a5f3fc; font-size:10px;
      font-weight:700; letter-spacing:2px; text-transform:uppercase; }
    .dot { width:6px; height:6px; border-radius:50%; background:#34d399; box-shadow:0 0 10px #34d399; }
    h1 { margin:9px 0 8px; font-size:34px; line-height:1.1; letter-spacing:-1.5px; font-weight:800; }
    .bio { max-width:315px; margin:0 auto 23px; color:#aab6ca; font-size:12px; line-height:1.8; }
    .social { display:grid; gap:10px; }
    .social a {
      display:flex; align-items:center; justify-content:center; gap:11px; min-height:49px;
      padding:12px 16px; color:#eef6ff; text-decoration:none; font-size:13px; font-weight:600;
      border:1px solid rgba(255,255,255,.10); border-radius:14px;
      background:rgba(255,255,255,.055); transition:transform .22s,background .22s,border-color .22s,box-shadow .22s;
      -webkit-tap-highlight-color:transparent;
    }
    .social a i { width:20px; font-size:17px; }
    .social a:hover, .social a:focus-visible {
      outline:none; transform:translateY(-3px); color:#04121a;
      background:linear-gradient(100deg,#67e8f9,#a78bfa); border-color:transparent;
      box-shadow:0 10px 28px #22d3ee30;
    }
    .social a:active { transform:scale(.985); }
    .footer { margin-top:21px; color:#64748b; font-size:10px; letter-spacing:.4px; }
    @media(max-width:380px) { .card { padding:29px 19px 23px; } h1 {font-size:30px;} }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
  </style>
