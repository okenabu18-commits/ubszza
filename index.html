<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>PIXELVERSE</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg: #101013;
            --p: #18181d;
            --p2: #202027;
            --b: #2d2d37;
            --t: #ececf4;
            --m: #8a8aa0;
            --g: linear-gradient(135deg, #8b5cf6, #3b82f6)
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html,
        body {
            height: 100%
        }

        body {
            font: 13px/1.4 Inter, "Segoe UI", system-ui, sans-serif;
            background: var(--bg);
            color: var(--t);
            overflow: hidden
        }

        button,
        input,
        select {
            font: inherit;
            color: inherit
        }

        .hide {
            display: none !important
        }

        .scr {
            height: 100%;
            position: relative
        }

        .btn {
            background: var(--p2);
            border: 1px solid var(--b);
            border-radius: 9px;
            padding: 7px 12px;
            cursor: pointer;
            transition: .15s;
            white-space: nowrap
        }

        .btn:hover {
            border-color: #7c6be0;
            background: #292936
        }

        .pri {
            background: var(--g);
            border-color: transparent;
            font-weight: 600
        }

        .pri:hover {
            filter: brightness(1.12);
            background: var(--g)
        }

        input,
        select {
            background: #14141a;
            border: 1px solid var(--b);
            border-radius: 8px;
            padding: 7px 10px;
            outline: 0;
            width: 100%
        }

        input:focus,
        select:focus,
        .btn:focus-visible {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px #8b5cf633;
            outline: 0
        }

        input[type=checkbox] {
            width: auto;
            accent-color: #8b5cf6
        }

        input[type=color] {
            padding: 2px;
            height: 34px;
            width: 54px;
            cursor: pointer
        }

        input[type=range] {
            padding: 0;
            accent-color: #8b5cf6
        }

        label {
            display: block;
            color: var(--m);
            margin: 10px 0 4px
        }

        .chk {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 6px 0;
            color: var(--t)
        }

        .logo {
            font-weight: 900;
            letter-spacing: .16em;
            font-size: 20px;
            background: var(--g);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        .mk {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #8b5cf6;
            box-shadow: 8px 0 #3b82f6, 0 8px #3b82f6, 8px 8px #c4b5fd;
            margin: 0 22px 8px 0;
            vertical-align: middle
        }

        #auth {
            display: grid;
            place-items: center;
            background: radial-gradient(700px 500px at 15% 10%, #5b3fd455, transparent), radial-gradient(600px 500px at 90% 90%, #2563eb44, transparent), var(--bg);
            overflow: auto
        }

        .card0 {
            width: min(400px, 92vw);
            background: #1a1a2199;
            backdrop-filter: blur(18px);
            border: 1px solid #ffffff1c;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 30px 80px #000a
        }

        .tabs {
            display: flex;
            background: #0e0e12;
            border-radius: 11px;
            padding: 4px;
            margin: 18px 0 6px
        }

        .tabs button {
            flex: 1;
            border: 0;
            background: 0;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--m)
        }

        .tabs .on {
            background: var(--p2);
            color: var(--t)
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: center
        }

        .row>* {
            flex: 1
        }

        .row .btn {
            flex: none
        }

        .soc {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px
        }

        #dash {
            overflow: auto;
            padding: 0 6vw 40px
        }

        .dh {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 22px 0
        }

        .dh .sp,
        .sp {
            flex: 1
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 16px
        }

        .pc {
            background: var(--p);
            border: 1px solid var(--b);
            border-radius: 16px;
            overflow: hidden;
            transition: .2s
        }

        .pc:hover {
            border-color: #7c6be0;
            transform: translateY(-2px)
        }

        .th {
            height: 140px;
            display: grid;
            place-items: center;
            cursor: pointer;
            background: repeating-conic-gradient(#25252d 0 25%, #2e2e38 0 50%) 0 0/16px 16px
        }

        .th img {
            image-rendering: pixelated;
            max-width: 100%;
            max-height: 100%
        }

        .pc .in {
            padding: 12px
        }

        .pc small {
            color: var(--m)
        }

        .pc .ac {
            display: flex;
            gap: 6px;
            margin-top: 10px
        }

        .pc .ac .btn {
            padding: 4px 9px;
            font-size: 12px
        }

        .empty {
            grid-column: 1/-1;
            text-align: center;
            color: var(--m);
            padding: 60px;
            border: 1px dashed var(--b);
            border-radius: 16px
        }

        #studio {
            display: grid;
            grid-template-rows: 52px 1fr 28px
        }

        .top {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px;
            background: #15151ae6;
            border-bottom: 1px solid var(--b);
            overflow-x: auto
        }

        .top .btn {
            padding: 6px 10px
        }

        .top input {
            width: 170px
        }

        .main {
            display: grid;
            grid-template-columns: 56px 1fr 268px;
            min-height: 0
        }

        #tools {
            background: var(--p);
            border-right: 1px solid var(--b);
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            overflow: auto
        }

        #tools button {
            width: 40px;
            height: 40px;
            border-radius: 11px;
            border: 0;
            background: 0;
            color: var(--m);
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: .15s;
            flex: none
        }

        #tools button:hover {
            background: var(--p2);
            color: var(--t)
        }

        #tools .on {
            background: var(--g);
            color: #fff;
            box-shadow: 0 4px 14px #7c5cf655
        }

        #vp {
            position: relative;
            overflow: hidden;
            background: #0c0c0f;
            touch-action: none;
            cursor: crosshair
        }

        #stage {
            position: absolute;
            left: 0;
            top: 0;
            box-shadow: 0 0 0 1px #ffffff22, 0 20px 60px #000a;
            transform-origin: 0 0
        }

        #stage canvas,
        #gr {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            pointer-events: none
        }

        #props {
            background: var(--p);
            border-left: 1px solid var(--b);
            overflow: auto;
            padding: 4px 14px 20px
        }

        #props section {
            padding: 12px 0;
            border-bottom: 1px solid var(--b)
        }

        #props h4 {
            font-weight: 600;
            margin-bottom: 8px
        }

        #props h4 b {
            color: #a78bfa
        }

        .sw {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin: 8px 0
        }

        .sw i {
            width: 20px;
            height: 20px;
            border-radius: 5px;
            border: 1px solid #ffffff2a;
            cursor: pointer
        }

        .sw i:hover {
            transform: scale(1.18)
        }

        .ly {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            border-radius: 9px;
            cursor: pointer;
            border: 1px solid transparent
        }

        .ly:hover {
            background: var(--p2)
        }

        .ly.on {
            background: #8b5cf622;
            border-color: #8b5cf688
        }

        .ly span {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .ly button {
            background: 0;
            border: 0;
            cursor: pointer;
            color: var(--m);
            font-size: 15px
        }

        #sb {
            display: flex;
            gap: 18px;
            align-items: center;
            padding: 0 14px;
            background: var(--p);
            border-top: 1px solid var(--b);
            color: var(--m);
            font-size: 12px;
            overflow: hidden;
            white-space: nowrap
        }

        .ov {
            position: fixed;
            inset: 0;
            background: #000b;
            backdrop-filter: blur(6px);
            display: grid;
            place-items: center;
            z-index: 50
        }

        .md {
            width: min(420px, 92vw);
            background: #1b1b22;
            border: 1px solid #ffffff22;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 30px 80px #000
        }

        .md h3 {
            margin-bottom: 8px
        }

        .mb {
            color: #c4c4d4
        }

        .mf {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 18px
        }

        #toasts {
            position: fixed;
            right: 16px;
            bottom: 44px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 99
        }

        .toast {
            background: #23232d;
            border: 1px solid #8b5cf666;
            border-left: 4px solid #8b5cf6;
            padding: 10px 14px;
            border-radius: 10px;
            box-shadow: 0 10px 30px #000a;
            animation: ti .25s
        }

        .toast.err {
            border-color: #f43f5e66;
            border-left-color: #f43f5e
        }

        @keyframes ti {
            from {
                opacity: 0;
                transform: translateX(20px)
            }
        }

        @media(max-width:820px) {
            .main {
                grid-template-columns: 52px 1fr;
                grid-template-rows: 1fr 36vh
            }

            #props {
                grid-column: 1/3;
                border-left: 0;
                border-top: 1px solid var(--b)
            }
        }
    
        @media(max-width:760px) {
            #globalSearch { max-width:130px !important; }
            #studioCoins { display:none; }
            #aiRate { font-size:11px; padding:6px 8px; }
        }
</style>
</head>

<body>
    <div id="auth" class="scr">
        <div class="card0">
            <div><i class="mk"></i><span class="logo">PixelVerse</span></div>
            <p style="color:var(--m);margin-top:6px">Draw pixel art in your browser. Everything stays on this device.
            </p>
            <div class="tabs"><button id="t1" class="on">Sign in</button><button id="t2">Create account</button></div>
            <div id="fu" class="hide"><label>Username</label><input id="au" autocomplete="username"></div>
            <label id="le">Email or username</label><input id="ae" autocomplete="email"><label>Password</label><input
                id="ap" type="password" autocomplete="current-password">
            <div class="row" style="margin-top:8px"><label class="chk"><input type="checkbox" id="sp"> Show
                    password</label><label class="chk"><input type="checkbox" id="rm" checked> Remember login</label>
            </div>
            <button class="btn pri" id="go" style="width:100%;margin-top:10px;padding:10px">Sign in</button>
            <div class="soc"><button class="btn" id="gg">Google</button>
            </div>
        </div>
    </div>
    <div id="dash" class="scr hide">
        <div class="dh"><i class="mk" style="margin:0 14px 8px 0"></i><span class="logo">PIXELVERSE</span><span
                class="sp"></span><span id="un" style="color:var(--m)"></span><button class="btn" id="imp">Import
                JSON</button><button class="btn" id="lo">Sign out</button><button class="btn pri" id="na">New
                artwork</button></div>
        <h3 style="margin:8px 0 14px">Recent projects</h3>
        <div id="grid"></div>
    </div>
    <div id="studio" class="scr hide">
        <header class="top"><button class="btn" id="bk">‹ Projects</button><input id="pn"
                aria-label="Project name"><button class="btn" id="un1">Undo</button><button class="btn"
                id="re1">Redo</button><span class="sp"></span><button class="btn" id="svb">Save</button><button
                class="btn" id="imp2">Import JSON</button><button class="btn" id="exj">Export JSON</button><button
                class="btn" id="exp">PNG</button><button class="btn pri" id="ext">Transparent PNG</button></header>
        <div class="main">
            <nav id="tools"></nav>
            <div id="vp">
                <div id="stage"><canvas id="cv"></canvas><canvas id="ov"></canvas>
                    <div id="gr"></div>
                </div>
            </div>
            <aside id="props">
                <section>
                    <h4>Color</h4>
                    <div class="row"><input type="color" id="cp" style="flex:none"><input id="hex" maxlength="7"
                            spellcheck="false"></div><label>History</label>
                    <div class="sw" id="hist"></div><select id="pal"></select>
                    <div class="sw" id="pw"></div><button class="btn" id="addc" style="width:100%">Save color to
                        Custom</button>
                </section>
                <section>
                    <h4>Brush size <b id="bsv">1</b> px</h4><input type="range" id="bs" min="1" max="16" value="1">
                </section>
                <section>
                    <h4>Canvas</h4>
                    <div class="row"><button class="btn" id="zo">−</button><b id="zl"
                            style="text-align:center"></b><button class="btn" id="zi">+</button><button class="btn"
                            id="ct">Center</button></div>
                    <label class="chk"><input type="checkbox" id="gc" checked> Pixel grid</label><label
                        class="chk"><input type="checkbox" id="kc" checked> Checkerboard</label>
                    <div class="row"><label class="chk" style="margin:0"><input type="checkbox" id="bc"> Solid
                            background</label><input type="color" id="bgc" value="#ffffff" style="flex:none"></div>
                    <label>PNG export scale</label><select id="es">
                        <option>1</option>
                        <option>2</option>
                        <option>4</option>
                        <option selected>8</option>
                        <option>16</option>
                    </select>
                </section>
                <section>
                    <h4>Layers</h4>
                    <div id="layers"></div>
                    <div class="row" style="margin:8px 0"><button class="btn" id="la"
                            title="Add layer">+</button><button class="btn" id="ld"
                            title="Delete layer">Del</button><button class="btn" id="lu"
                            title="Move up">↑</button><button class="btn" id="ldn" title="Move down">↓</button></div>
                    <label>Layer opacity</label><input type="range" id="lop" min="0" max="100" value="100">
                </section>
            </aside>
        </div>
        <footer id="sb"><span id="s1"></span><span id="s2">x 0, y 0</span><span id="s3"></span><span
                id="s4"></span><span class="sp"></span><span id="s5">Space + drag to pan · wheel to zoom</span></footer>
    </div>
    <div id="toasts"></div><input type="file" id="ff" accept=".json,application/json" class="hide">
    <script>
        const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const LS = { g(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v } catch { return d } }, s(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return 1 } catch { toast('Browser storage is full. Export your project as JSON.', 'err') } } };
        const uid = () => Math.random().toString(36).slice(2, 10), hash = s => { let h = 5381; for (const c of 'pv$' + s) h = (h * 33 ^ c.charCodeAt(0)) >>> 0; return h.toString(36) };
        function toast(m, t) { const e = document.createElement('div'); e.className = 'toast ' + (t || ''); e.textContent = m; $('#toasts').append(e); setTimeout(() => e.remove(), 3400) }
        function modal(title, html, btns = [['OK', 1, 1]]) { return new Promise(r => { const o = document.createElement('div'); o.className = 'ov'; o.innerHTML = `<div class="md" role="dialog"><h3>${title}</h3><div class="mb">${html}</div><div class="mf"></div></div>`; btns.forEach(([l, ok, pr]) => { const b = document.createElement('button'); b.className = 'btn' + (pr ? ' pri' : ''); b.textContent = l; b.onclick = () => { const v = [...o.querySelectorAll('input,select')].map(i => i.type == 'checkbox' ? i.checked : i.value); o.remove(); r(ok ? v : null) }; o.querySelector('.mf').append(b) }); document.body.append(o); const i = o.querySelector('input'); if (i) i.focus() }) }
        const show = id => ['auth', 'dash', 'studio'].forEach(s => $('#' + s).classList.toggle('hide', s != id));
        /* ---------- AUTH ---------- */
        let U, mode = 1; const key = () => 'pv_p_' + U.id;
        // Coins and AI reward history are stored per signed-in local account.
        const coinKey = () => 'pv_coins_' + U.id;
        const rewardKey = () => 'pv_ai_rewards_' + U.id;
        function coins() { return LS.g(coinKey(), 0) || 0 }
        function refreshCoins() {
            if (!U) return;
            const n = coins();
            if ($('#coinCount')) $('#coinCount').textContent = n.toLocaleString();
            if ($('#studioCoins')) $('#studioCoins').textContent = '🪙 ' + n.toLocaleString();
        }

        function setMode(m) { mode = m; $('#t1').classList.toggle('on', m == 1); $('#t2').classList.toggle('on', m == 2); $('#fu').classList.toggle('hide', m == 1); $('#le').textContent = m == 1 ? 'Email or username' : 'Email'; $('#go').textContent = m == 1 ? 'Sign in' : 'Create account' }
        $('#t1').onclick = () => setMode(1); $('#t2').onclick = () => setMode(2);
        $('#sp').onchange = e => $('#ap').type = e.target.checked ? 'text' : 'password';
        $('#go').onclick = () => {
            const users = LS.g('pv_users', {}), e = $('#ae').value.trim().toLowerCase(), p = $('#ap').value, n = $('#au').value.trim();
            if (!e || !p) return toast('Enter your email and password.', 'err');
            if (mode == 2) {
                if (!/^\S+@\S+\.\S+$/.test(e)) return toast('Enter a valid email address.', 'err'); if (n.length < 2) return toast('Choose a username with at least 2 characters.', 'err'); if (p.length < 6) return toast('Password needs at least 6 characters.', 'err');
                if (users[e] || Object.values(users).some(u => u.name.toLowerCase() == n.toLowerCase())) return toast('That email or username is already registered.', 'err');
                users[e] = { id: uid(), name: n, email: e, h: hash(p) }; LS.s('pv_users', users); toast('Account created. Welcome, ' + n + '!'); enter(users[e])
            }
            else { const u = users[e] || Object.values(users).find(x => x.name.toLowerCase() == e); if (!u || u.h != hash(p)) return toast('Wrong email, username or password.', 'err'); enter(u) }
        };
        function enter(u) { if (!u || !u.id || u.id === 'guest') return toast('Please create an account or sign in.', 'err'); U = { id: u.id, name: u.name }; if ($('#rm').checked) LS.s('pv_sess', U); else sessionStorage.setItem('pv_sess', JSON.stringify(U)); $('#un').textContent = U.name; show('dash'); refreshCoins(); renderDash() }
        $('#lo').onclick = () => { localStorage.removeItem('pv_sess'); sessionStorage.removeItem('pv_sess'); show('auth') };
        const GOOGLE_CLIENT_ID = '85483636596-gut14ntiotibp32c6mmqdefdsol1jgpb.apps.googleusercontent.com';
        function handleGoogleCredential(response) {
            try {
                const part = response.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
                const claims = JSON.parse(decodeURIComponent(Array.from(atob(part), c =>
                    '%' + c.charCodeAt(0).toString(16).padStart(2, '0')).join('')));
                if (!claims.sub) throw new Error('Missing Google account ID');
                // Browser-side profile sign-in only. Verify the ID token on a server for production security.
                enter({ id: 'google_' + claims.sub, name: claims.name || claims.email || 'Google user' });
                toast('Signed in with Google. Your projects and coins are stored in this browser.');
            } catch (err) {
                console.error(err);
                toast('Google sign-in failed. Check OAuth client settings.', 'err');
            }
        }
        $('#gg').onclick = () => {
            if (!window.google?.accounts?.id) return toast('Google sign-in is loading. Try again.', 'err');
            const old = document.getElementById('google-login-overlay');
            if (old) old.remove();
            const overlay = document.createElement('div');
            overlay.id = 'google-login-overlay';
            overlay.className = 'ov';
            overlay.innerHTML = `<div class="md" role="dialog" aria-modal="true"><h3>Continue with Google</h3><div class="mb"><p style="margin:0 0 16px;color:#a1a1aa">Choose your Google account.</p><div id="google-button-mount" style="display:flex;justify-content:center;min-height:44px"></div></div><div class="mf"><button type="button" class="btn" id="google-login-cancel">Cancel</button></div></div>`;
            document.body.append(overlay);
            document.getElementById('google-login-cancel').onclick = () => overlay.remove();
            overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
            try {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: response => { overlay.remove(); handleGoogleCredential(response); },
                    auto_select: false,
                    cancel_on_tap_outside: true
                });
                google.accounts.id.renderButton(document.getElementById('google-button-mount'),
                    { theme: 'filled_black', size: 'large', shape: 'pill', text: 'continue_with', width: 260 });
            } catch (err) {
                console.error(err);
                overlay.remove();
                toast('Google setup error. Check https://abuzzy.uz in Authorized JavaScript origins.', 'err');
            }
        };
        /* ---------- TELEGRAM LOGIN ---------- */
        // Telegram Login Widget for @PixelverseLoginBot.
        // The widget returns signed user data; production must verify its hash server-side.
        window.onPixelverseTelegramAuth = function (user) {
            if (!user || !user.id) {
                toast('Telegram did not return a valid profile.', 'err');
                return;
            }
            // Browser-local profile session only. Do not use this as authorization
            // for payments, private data, or privileged actions until server-verified.
            const displayName = [user.first_name, user.last_name].filter(Boolean).join(' ')
                || (user.username ? '@' + user.username : 'Telegram User');
            enter({
                id: 'telegram_' + String(user.id),
                name: displayName,
                telegramUsername: user.username || ''
            });
            toast('Telegram profile connected. Welcome, ' + displayName + '!');
        };

        $('#tg').onclick = () => {
            const old = document.getElementById('telegram-login-overlay');
            if (old) old.remove();

            const overlay = document.createElement('div');
            overlay.id = 'telegram-login-overlay';
            overlay.className = 'ov';
            overlay.innerHTML = `
                <div class="md" role="dialog" aria-modal="true">
                    <h3>Continue with Telegram</h3>

        $('#tools').onclick = e => { const b = e.target.closest('[data-t]'); if (b) setTool(b.dataset.t) }; setTool('pencil');
        /* ---------- COLORS ---------- */
        const PAL = { 'Pico-8': '000000 1d2b53 7e2553 008751 ab5236 5f574f c2c3c7 fff1e8 ff004d ffa300 ffec27 00e436 29adff 83769c ff77a8 ffccaa', 'Game Boy': '0f380f 306230 8bac0f 9bbc0f', 'Sunset': '2b0f54 6a1b9a c2185b ef5350 ff7043 ffb74d fff176', 'Pastel': 'ffd1dc ffe4b5 fdfd96 b5ead7 a0e7e5 c7ceea e2b6f2', 'Grayscale': '000000 222222 444444 666666 888888 aaaaaa cccccc eeeeee ffffff', 'Custom': '' };
        let ch = LS.g('pv_hist', []), cust = LS.g('pv_custom', []);
        const sw = (a, id) => $(id).innerHTML = a.map(c => `<i style="background:${c}" data-c="${c}" title="${c}"></i>`).join('') || '<small style="color:var(--m)">Empty</small>';
        $('#pal').innerHTML = Object.keys(PAL).map(k => `<option>${k}</option>`).join('');
        const palList = () => $('#pal').value == 'Custom' ? cust : PAL[$('#pal').value].split(' ').map(c => '#' + c);
        const showPal = () => sw(palList(), '#pw'); $('#pal').onchange = showPal; showPal(); sw(ch, '#hist');
        function addHist(c) { if (ch[0] == c) return; ch = [c, ...ch.filter(x => x != c)].slice(0, 14); LS.s('pv_hist', ch); sw(ch, '#hist') }
        function setColor(c) { color = c.toLowerCase(); $('#cp').value = color; $('#hex').value = color }
        $('#cp').oninput = e => setColor(e.target.value); $('#hex').oninput = e => { let v = e.target.value.trim(); if (v[0] != '#') v = '#' + v; if (/^#[0-9a-f]{6}$/i.test(v)) { color = v.toLowerCase(); $('#cp').value = color } };
        $('#props').onclick = e => { const i = e.target.closest('[data-c]'); if (i) setColor(i.dataset.c) };
        $('#addc').onclick = () => { if (!cust.includes(color)) { cust.push(color); LS.s('pv_custom', cust) } $('#pal').value = 'Custom'; showPal(); toast('Color saved to Custom palette') };
        $('#bs').oninput = e => { bs = +e.target.value; $('#bsv').textContent = bs }; setColor(color);
        /* ---------- LAYERS ---------- */
        function drawLayers() {
            const L = $('#layers'); L.innerHTML = ''; layers.map((l, i) => i).reverse().forEach(i => {
                const l = layers[i], d = document.createElement('div'); d.className = 'ly' + (i == ai ? ' on' : ''); d.innerHTML = `<button title="Show or hide">${l.vis ? '◉' : '○'}</button><span title="Double-click to rename">${esc(l.name)}</span><small style="color:var(--m)">${Math.round(l.op * 100)}%</small>`;
                d.onclick = e => { if (e.target.tagName == 'BUTTON') { l.vis = !l.vis; commit() } else { ai = i; drawLayers() } };
                d.ondblclick = async e => { if (e.target.tagName == 'BUTTON') return; const r = await modal('Rename layer', `<input value="${esc(l.name)}">`, [['Cancel', 0], ['Rename', 1, 1]]); if (r && r[0].trim()) { l.name = r[0].trim().slice(0, 40); commit() } }; L.append(d)
            });
            $('#lop').value = Math.round(cur().op * 100); $('#s5').textContent = 'Layer: ' + cur().name + ' · Space + drag to pan · wheel to zoom'
        }
        $('#la').onclick = () => { layers.splice(ai + 1, 0, mkL('Layer ' + (++lc))); ai++; commit() };
        $('#ld').onclick = () => { if (layers.length < 2) return toast('A project needs at least one layer.', 'err'); layers.splice(ai, 1); ai = Math.max(0, ai - 1); commit() };
        $('#lu').onclick = () => { if (ai < layers.length - 1) { [layers[ai], layers[ai + 1]] = [layers[ai + 1], layers[ai]]; ai++; commit() } };
        $('#ldn').onclick = () => { if (ai > 0) { [layers[ai], layers[ai - 1]] = [layers[ai - 1], layers[ai]]; ai--; commit() } };
        $('#lop').oninput = e => { cur().op = e.target.value / 100; render() }; $('#lop').onchange = () => commit();
        /* ---------- TOP BAR & KEYS ---------- */
        $('#un1').onclick = undo; $('#re1').onclick = redo; $('#svb').onclick = () => saveProject();
        $('#exj').onclick = () => { const p = serialize(); dl(URL.createObjectURL(new Blob([JSON.stringify(p)], { type: 'application/json' })), PR.name + '.pixelverse.json'); toast('Project exported as JSON') };
        $('#exp').onclick = () => exportPNG(0); $('#ext').onclick = () => exportPNG(1);
        $('#bk').onclick = () => { clearTimeout(saveT); saveProject(1); show('dash'); renderDash() };
        $('#pn').oninput = e => { PR.name = e.target.value.slice(0, 60) || 'Untitled'; queueSave() };
        addEventListener('keydown', e => {
            if ($('#studio').classList.contains('hide') || /INPUT|SELECT/.test(e.target.tagName) && e.target.type != 'checkbox' && e.target.type != 'range') return;
            const k = e.key.toLowerCase(), m = e.ctrlKey || e.metaKey;
            if (m && k == 'z') { e.preventDefault(); e.shiftKey ? redo() : undo() } else if (m && k == 'y') { e.preventDefault(); redo() } else if (m && k == 's') { e.preventDefault(); saveProject() }
            else if (m) return; else if (k == ' ') { e.preventDefault(); space = true; vp.style.cursor = 'grab' }
            else if (k == '+' || k == '=') { zIn() } else if (k == '-') { zOut() } else if (k == '0') center();
            else if (k == 'u') setTool(e.shiftKey ? 'frect' : 'rect'); else if (k == 'o') setTool(e.shiftKey ? 'fcircle' : 'circle');
            else { const t = { b: 'pencil', e: 'eraser', g: 'bucket', i: 'eyedrop', l: 'line', m: 'move', h: 'hand' }[k]; if (t) setTool(t) }
        });
        addEventListener('keyup', e => { if (e.key == ' ') { space = false; vp.style.cursor = tool == 'hand' ? 'grab' : 'crosshair' } });
        addEventListener('beforeunload', () => { if (PR && !$('#studio').classList.contains('hide')) saveProject(1) });
        /* ---------- BOOT ---------- */
        {
            let s = LS.g('pv_sess', null); if (!s) try { s = JSON.parse(sessionStorage.getItem('pv_sess')) } catch { }
            if (s && s.id && s.id !== 'guest') { U = s; $('#un').textContent = U.name; show('dash'); renderDash() } else { localStorage.removeItem('pv_sess'); show('auth') }
        }
    </script>
</body>

</html>
