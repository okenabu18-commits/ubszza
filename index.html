
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    viewport-fit=cover"
>

<title>TV Player</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

/* PLAYER */

.player {
    width: min(1000px, 100vw);
    background: #000;
}

/* VIDEO */

.video-box {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    overflow: hidden;
}

.video-box iframe {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    border: 0;
    display: block;
}

/* TV LABEL */

.tv-label {
    position: absolute;
    top: 15px;
    left: 15px;

    display: flex;
    align-items: center;
    gap: 7px;

    padding: 7px 10px;

    color: #fff;
    background: rgba(0,0,0,.55);

    border-radius: 7px;

    font-size: 12px;
    font-weight: bold;

    z-index: 10;
    pointer-events: none;
}

.dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;
    background: #ff1744;

    box-shadow: 0 0 10px #ff1744;
}

/* FULLSCREEN BUTTON */

.fullscreen-btn {
    position: absolute;

    right: 12px;
    bottom: 12px;

    width: 45px;
    height: 45px;

    border: 0;
    border-radius: 9px;

    background: rgba(0,0,0,.75);
    color: #fff;

    font-size: 23px;

    cursor: pointer;
    z-index: 20;

    display: flex;
    align-items: center;
    justify-content: center;

    touch-action: manipulation;
}

.fullscreen-btn:active {
    transform: scale(.92);
}

/* INFO */

.info {
    padding: 14px;
    background: #0b0b0b;
    color: #fff;
}

.title {
    font-size: 18px;
    font-weight: 700;
}

.subtitle {
    margin-top: 5px;
    color: #888;
    font-size: 13px;
}

/* FULLSCREEN */

.video-box:fullscreen {
    width: 100vw !important;
    height: 100vh !important;

    max-width: none !important;
    aspect-ratio: auto !important;

    background: #000;
}

.video-box:fullscreen iframe {
    width: 100vw !important;
    height: 100vh !important;
}

/* WEBKIT */

.video-box:-webkit-full-screen {
    width: 100vw !important;
    height: 100vh !important;
    background: #000;
}

.video-box:-webkit-full-screen iframe {
    width: 100vw !important;
    height: 100vh !important;
}

/* MOBILE */

@media (max-width: 600px) {

    .player {
        width: 100vw;
    }

    .video-box {
        width: 100vw;
    }

    .fullscreen-btn {
        width: 42px;
        height: 42px;

        right: 9px;
        bottom: 9px;
    }

    .info {
        padding: 12px;
    }

    .title {
        font-size: 16px;
    }
}

/* LANDSCAPE */

@media (
    max-width: 950px
) and (
    orientation: landscape
) {

    body {
        width: 100vw;
        height: 100vh;
    }

    .player {
        width: 100vw;
        height: 100vh;
    }

    .video-box {
        width: 100vw;
        height: 100vh;
        aspect-ratio: auto;
    }

    .video-box iframe {
        width: 100vw;
        height: 100vh;
    }

    .info {
        display: none;
    }
}
</style>
</head>

<body>

<div class="player">

    <div
        class="video-box"
        id="videoBox"
    >

        <!-- ORIGINAL OK.RU PLAYER -->

        <iframe
            id="okPlayer"
            src="https://ok.ru/videoembed/10478943930903"
            title="OK.ru Video"
            allow="
                autoplay;
                fullscreen;
                picture-in-picture;
                encrypted-media
            "
            allowfullscreen
            webkitallowfullscreen
            mozallowfullscreen
        ></iframe>


        <!-- TV LABEL -->

        <div class="tv-label">
            <span class="dot"></span>
            TV
        </div>


        <!-- FULLSCREEN -->

        <button
            id="fullscreenBtn"
            class="fullscreen-btn"
            type="button"
            aria-label="Fullscreen"
        >
            ⛶
        </button>

    </div>


    <div class="info">

        <div class="title">
            Azobli muhabbat
        </div>

        <div class="subtitle">
            OK.ru • Responsive TV Player
        </div>

    </div>

</div>


<script>

const videoBox =
    document.getElementById("videoBox");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");


/* CHECK */

function isFullscreen() {

    return !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement
    );

}


/* LANDSCAPE */

async function lockLandscape() {

    try {

        if (
            screen.orientation &&
            screen.orientation.lock
        ) {

            await screen.orientation.lock(
                "landscape"
            );

        }

    } catch (error) {

        console.log(
            "Landscape lock unavailable:",
            error
        );

    }

}


/* UNLOCK */

function unlockOrientation() {

    try {

        if (
            screen.orientation &&
            screen.orientation.unlock
        ) {

            screen.orientation.unlock();

        }

    } catch (error) {}

}


/* ENTER */

async function enterFullscreen() {

    try {

        if (
            videoBox.requestFullscreen
        ) {

            await videoBox.requestFullscreen({
                navigationUI: "hide"
            });

        }

        else if (
            videoBox.webkitRequestFullscreen
        ) {

            videoBox.webkitRequestFullscreen();

        }

        else if (
            videoBox.mozRequestFullScreen
        ) {

            videoBox.mozRequestFullScreen();

        }

        else if (
            videoBox.msRequestFullscreen
        ) {

            videoBox.msRequestFullscreen();

        }

        await lockLandscape();

    }

    catch (error) {

        console.log(
            "Fullscreen error:",
            error
        );

    }

}


/* EXIT */

async function exitFullscreen() {

    try {

        if (
            document.exitFullscreen
        ) {

            await document.exitFullscreen();

        }

        else if (
            document.webkitExitFullscreen
        ) {

            document.webkitExitFullscreen();

        }

        else if (
            document.mozCancelFullScreen
        ) {

            document.mozCancelFullScreen();

        }

        else if (
            document.msExitFullscreen
        ) {

            document.msExitFullscreen();

        }

    } catch (error) {}

    unlockOrientation();

}


/* BUTTON */

fullscreenBtn.addEventListener(
    "click",
    async function() {

        if (isFullscreen()) {

            await exitFullscreen();

        } else {

            await enterFullscreen();

        }

    }
);


/* CHANGE */

document.addEventListener(
    "fullscreenchange",
    function() {

        if (!isFullscreen()) {
            unlockOrientation();
        }

    }
);

document.addEventListener(
    "webkitfullscreenchange",
    function() {

        if (!isFullscreen()) {
            unlockOrientation();
        }

    }
);


/* KEYBOARD */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key.toLowerCase() === "f"
        ) {

            if (isFullscreen()) {
                exitFullscreen();
            } else {
                enterFullscreen();
            }

        }

    }
);

</script>

</body>
</html>
