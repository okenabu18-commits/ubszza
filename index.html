<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABU TV — Bergen HD</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        header {
            height: 70px;
            background: #0d0d0d;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            color: #00aaff;
        }

        .live {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #aaa;
        }

        .dot {
            width: 9px;
            height: 9px;
            background: red;
            border-radius: 50%;
            box-shadow: 0 0 10px red;
        }

        main {
            width: 100%;
            max-width: 1500px;
            margin: auto;
            padding: 25px;
        }

        .player {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 10px 50px rgba(0,0,0,.6);
        }

        .player iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .info {
            padding: 20px 5px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .meta {
            display: flex;
            gap: 15px;
            color: #aaa;
            flex-wrap: wrap;
        }

        .badge {
            background: #151515;
            padding: 8px 13px;
            border-radius: 8px;
        }

        .episodes {
            margin-top: 25px;
        }

        .episodes h2 {
            margin-bottom: 15px;
        }

        .episode-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }

        .episode {
            background: #111;
            border: 1px solid #242424;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: .2s;
        }

        .episode:hover {
            background: #1c1c1c;
            border-color: #00aaff;
            transform: translateY(-2px);
        }

        .episode.active {
            border-color: #00aaff;
            background: #09202b;
        }

        footer {
            text-align: center;
            color: #666;
            padding: 30px;
        }

        @media (max-width: 700px) {
            header {
                padding: 0 15px;
            }

            .logo {
                font-size: 20px;
            }

            main {
                padding: 12px;
            }

            .title {
                font-size: 21px;
            }

            .player {
                border-radius: 8px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">ABU TV</div>

    <div class="live">
        <span class="dot"></span>
        ONLINE
    </div>
</header>

<main>

    <div class="player">
        <iframe
            id="videoPlayer"
            src="https://ok.ru/videoembed/9931741530647"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen>
        </iframe>
    </div>

    <div class="info">

        <div class="title" id="videoTitle">
            Bergen HD
        </div>

        <div class="meta">
            <div class="badge">🎬 Film</div>
            <div class="badge">HD</div>
            <div class="badge">⏱ 2:22:15</div>
            <div class="badge">OK.ru</div>
        </div>

    </div>

    <section class="episodes">

        <h2>📺 Qismlar</h2>

        <div class="episode-list">

            <div
                class="episode active"
                onclick="openEpisode(
                    'Bergen HD',
                    '2:22:15',
                    '9931741530647'
                )">
                <b>1-qism</b>
                <br>
                <small>2:22:15</small>
            </div>

        </div>

    </section>

</main>

<footer>
    ABU TV © 2026
</footer>


<script>

function openEpisode(title, duration, videoId) {

    const player = document.getElementById("videoPlayer");

    const titleElement = document.getElementById("videoTitle");

    player.src =
        "https://ok.ru/videoembed/" + videoId;

    titleElement.textContent = title;

    document.querySelectorAll(".episode").forEach(ep => {
        ep.classList.remove("active");
    });

    event.currentTarget.classList.add("active");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

</script>

</body>
</html>
